<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="871px" preserveAspectRatio="none" style="width:439px;height:871px;background:#FFFFFF;" version="1.1" viewBox="0 0 439 871" width="439px" zoomAndPan="magnify"><title>Crear solicitud de dispensa</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="214.9082" x="105.5442" y="22.9951">Crear solicitud de dispensa</text></g><g id="DISPENSAS_ABIERTO_INICIAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="167.3623" x="112.32" y="44.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="112.32" x2="279.6823" y1="70.5938" y2="70.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.3623" x="122.32" y="62.292">DISPENSAS_ABIERTO</text></g><g id="SOLICITUD_DISPENSA_ABIERTA_FINAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.3516" x="76.32" y="815.5969"/><line style="stroke:#181818;stroke-width:0.5;" x1="76.32" x2="315.6716" y1="841.8938" y2="841.8938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3516" x="86.32" y="833.592">SOLICITUD_DISPENSA_ABIERTA</text></g><path d="M19.5,155.2969 L372.5,155.2969 A12.5,12.5 0 0 1 385,167.7969 L385,181.5938 L7,181.5938 L7,167.7969 A12.5,12.5 0 0 1 19.5,155.2969" fill="#F1F1F1"/><rect fill="none" height="583.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="378" x="7" y="155.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="385" y1="181.5938" y2="181.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.6025" x="110.1987" y="173.292">crearSolicitudDispensa()</text><g id="crearSolicitudDispensa.FormularioDatos"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="313.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="339.8906" y2="339.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="331.5889">&#160;</text></g><g id="crearSolicitudDispensa.DecidirAccion"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="570.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="596.8906" y2="596.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="588.5889">&#160;</text></g><ellipse cx="44" cy="202.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="717.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="717.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*crearSolicitudDispensa to FormularioDatos--><g class="link" data-entity-1=".start.crearSolicitudDispensa" data-entity-2="FormularioDatos" data-link-type="dependency" data-source-line="14" data-uid="lnk4" id="link_.start.crearSolicitudDispensa_FormularioDatos"><path d="M44,212.8038 C44,233.2638 44,277.0638 44,307.1938" fill="none" id="*start*crearSolicitudDispensa-to-FormularioDatos" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,313.1938,48,304.1938,44,308.1938,40,304.1938,44,313.1938" style="stroke:#008000;stroke-width:1;"/><path d="M49,235.5938 L49,290.5938 L376,290.5938 L376,245.5938 L366,235.5938 L49,235.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M366,235.5938 L366,245.5938 L376,245.5938 L366,235.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="55" y="252.6606">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.5112" x="114.6362" y="252.6606">se encuentra en DISPENSAS_ABIERTO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.3149" x="55" y="267.7935">(listado de sus solicitudes) y selecciona</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.5229" x="55" y="282.9263">"Nueva solicitud de dispensa".</text></g><!--link FormularioDatos to DecidirAccion--><g class="link" data-entity-1="FormularioDatos" data-entity-2="DecidirAccion" data-link-type="dependency" data-source-line="21" data-uid="lnk5" id="link_FormularioDatos_DecidirAccion"><path d="M44,364.0438 C44,412.7838 44,515.5338 44,564.2138" fill="none" id="FormularioDatos-to-DecidirAccion" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,570.2138,48,561.2138,44,565.2138,40,561.2138,44,570.2138" style="stroke:#008000;stroke-width:1;"/><path d="M49,386.5938 L49,547.5938 L354,547.5938 L354,396.5938 L344,386.5938 L49,386.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M344,386.5938 L344,396.5938 L354,396.5938 L344,386.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="403.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.4824" x="118.0386" y="403.6606">presenta un formulario en blanco.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="55" y="418.7935">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="55" y="433.9263">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.8076" x="114.6362" y="433.9263">introduce los datos requeridos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.1934" x="55" y="449.0591">&#8226; Asignatura / periodo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.4165" x="55" y="464.1919">&#8226; Motivo de la dispensa</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.104" x="55" y="479.3247">&#8226; (Opcional) documentaci&#243;n adjunta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="55" y="494.4575">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.2485" x="55" y="509.5903">Al finalizar, el Alumno puede:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.3042" x="55" y="524.7231">&#8226; guardarSolicitud(), o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.7529" x="55" y="539.856">&#8226; cerrarSolicitud() sin guardar cambios.</text></g><!--link DecidirAccion to *end*crearSolicitudDispensa--><g class="link" data-entity-1="DecidirAccion" data-entity-2=".end.crearSolicitudDispensa" data-link-type="dependency" data-source-line="35" data-uid="lnk7" id="link_DecidirAccion_.end.crearSolicitudDispensa"><path d="M44,620.8738 C44,647.0438 44,681.4438 44,700.2738" fill="none" id="DecidirAccion-to-*end*crearSolicitudDispensa" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,706.2738,48,697.2738,44,701.2738,40,697.2738,44,706.2738" style="stroke:#008000;stroke-width:1;"/><path d="M49,643.5938 L49,683.5938 L322,683.5938 L322,653.5938 L312,643.5938 L49,643.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M312,643.5938 L312,653.5938 L322,653.5938 L312,643.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="660.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.7891" x="118.0386" y="660.6606">ejecuta la acci&#243;n elegida</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.8462" x="55" y="675.7935">(guardarSolicitud() o cerrarSolicitud()).</text></g><!--link DISPENSAS_ABIERTO_INICIAL to crearSolicitudDispensa--><g class="link" data-entity-1="DISPENSAS_ABIERTO_INICIAL" data-entity-2="crearSolicitudDispensa" data-link-type="dependency" data-source-line="7" data-uid="lnk2" id="link_DISPENSAS_ABIERTO_INICIAL_crearSolicitudDispensa"><path d="M196,94.6569 C196,109.6169 196,124.5369 196,148.8069" fill="none" id="DISPENSAS_ABIERTO_INICIAL-to-crearSolicitudDispensa" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="196,154.8069,200,145.8069,196,149.8069,192,145.8069,196,154.8069" style="stroke:#008000;stroke-width:1;"/></g><!--link crearSolicitudDispensa to SOLICITUD_DISPENSA_ABIERTA_FINAL--><g class="link" data-entity-1="crearSolicitudDispensa" data-entity-2="SOLICITUD_DISPENSA_ABIERTA_FINAL" data-link-type="dependency" data-source-line="43" data-uid="lnk8" id="link_crearSolicitudDispensa_SOLICITUD_DISPENSA_ABIERTA_FINAL"><path d="M196,738.9969 C196,770.2469 196,791.2169 196,809.3469" fill="none" id="crearSolicitudDispensa-to-SOLICITUD_DISPENSA_ABIERTA_FINAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="196,815.3469,200,806.3469,196,810.3469,192,806.3469,196,815.3469" style="stroke:#008000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234