nt-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.0024" x="55" y="281.9263">y selecciona la opci&#243;n "Cerrar solicitud".</text></g><!--link Paso1 to *end*cerrarSolicitud--><g class="link" data-entity-1="Paso1" data-entity-2=".end.cerrarSolicitud" data-link-type="dependency" data-source-line="20" data-uid="lnk6" id="link_Paso1_.end.cerrarSolicitud"><path d="M44,362.9437 C44,399.6937 44,461.7737 44,487.4437" fill="none" id="Paso1-to-*end*cerrarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,493.4437,48,484.4437,44,488.4437,40,484.4437,44,493.4437" style="stroke:#008000;stroke-width:1;"/><path d="M49,385.5937 L49,470.5937 L389,470.5937 L389,395.5937 L379,385.5937 L49,385.5937" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M379,385.5937 L379,395.5937 L389,395.5937 L379,385.5937" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="402.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.1025" x="118.0386" y="402.6606">cierra la vista de detalle de la solicitud,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.4985" x="55" y="417.7935">descarta cualquier cambio no guardado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.4785" x="55" y="432.9263">y vuelve al listado de solicitudes del Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.9111" x="55" y="448.0591">(DISPENSAS_ABIERTO) sin modificar el estado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.0903" x="55" y="463.1919">de la dispensa.</text></g><!--link SOLICITUD_DISPENSA_ABIERTA_INICIAL to cerrarS