<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="886px" preserveAspectRatio="none" style="width:472px;height:886px;background:#FFFFFF;" version="1.1" viewBox="0 0 472 886" width="472px" zoomAndPan="magnify"><title>Editar solicitud de dispensa</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="219.3105" x="119.843" y="22.9951">Editar solicitud de dispensa</text></g><g id="SOLICITUD_DISPENSA_ABIERTA_INICIAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.3516" x="109.32" y="44.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="109.32" x2="348.6716" y1="70.5938" y2="70.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3516" x="119.32" y="62.292">SOLICITUD_DISPENSA_ABIERTA</text></g><g id="SOLICITUD_DISPENSA_ABIERTA_FINAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.3516" x="109.32" y="830.5969"/><line style="stroke:#181818;stroke-width:0.5;" x1="109.32" x2="348.6716" y1="856.8938" y2="856.8938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3516" x="119.32" y="848.592">SOLICITUD_DISPENSA_ABIERTA</text></g><path d="M19.5,155.2969 L438.5,155.2969 A12.5,12.5 0 0 1 451,167.7969 L451,181.5938 L7,181.5938 L7,167.7969 A12.5,12.5 0 0 1 19.5,155.2969" fill="#F1F1F1"/><rect fill="none" height="598.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="444" x="7" y="155.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="451" y1="181.5938" y2="181.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.415" x="140.7925" y="173.292">editarSolicitudDispensa()</text><g id="editarSolicitudDispensa.PasoEdicion"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="313.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="339.8906" y2="339.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="331.5889">&#160;</text></g><g id="editarSolicitudDispensa.DecidirAccion"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="585.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="611.8906" y2="611.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="603.5889">&#160;</text></g><ellipse cx="44" cy="202.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="732.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="732.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*editarSolicitudDispensa to PasoEdicion--><g class="link" data-entity-1=".start.editarSolicitudDispensa" data-entity-2="PasoEdicion" data-link-type="dependency" data-source-line="15" data-uid="lnk4" id="link_.start.editarSolicitudDispensa_PasoEdicion"><path d="M44,212.8038 C44,233.2638 44,277.0638 44,307.1938" fill="none" id="*start*editarSolicitudDispensa-to-PasoEdicion" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,313.1938,48,304.1938,44,308.1938,40,304.1938,44,313.1938" style="stroke:#008000;stroke-width:1;"/><path d="M49,235.5938 L49,290.5938 L442,290.5938 L442,245.5938 L432,235.5938 L49,235.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M432,235.5938 L432,245.5938 L442,245.5938 L432,235.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="55" y="252.6606">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.3584" x="114.6362" y="252.6606">se encuentra en SOLICITUD_DISPENSA_ABIERTA</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.9272" x="55" y="267.7935">viendo el detalle de una solicitud de dispensa</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.4126" x="55" y="282.9263">y selecciona la opci&#243;n "Editar solicitud".</text></g><!--link PasoEdicion to DecidirAccion--><g class="link" data-entity-1="PasoEdicion" data-entity-2="DecidirAccion" data-link-type="dependency" data-source-line="22" data-uid="lnk5" id="link_PasoEdicion_DecidirAccion"><path d="M44,364.0338 C44,415.4338 44,528.2238 44,579.4038" fill="none" id="PasoEdicion-to-DecidirAccion" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,585.4038,48,576.4038,44,580.4038,40,576.4038,44,585.4038" style="stroke:#008000;stroke-width:1;"/><path d="M49,386.5938 L49,562.5938 L376,562.5938 L376,396.5938 L366,386.5938 L49,386.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M366,386.5938 L366,396.5938 L376,396.5938 L366,386.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="403.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.4771" x="118.0386" y="403.6606">mantiene el formulario de la solicitud</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.0493" x="55" y="418.7935">con los datos actuales.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="55" y="433.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="55" y="449.0591">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.2119" x="114.6362" y="449.0591">modifica los campos permitidos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.4165" x="55" y="464.1919">&#8226; Motivo de la dispensa</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.3931" x="55" y="479.3247">&#8226; Periodo / sesiones afectadas</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.104" x="55" y="494.4575">&#8226; (Opcional) documentaci&#243;n adjunta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="55" y="509.5903">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.2485" x="55" y="524.7231">Al finalizar, el Alumno puede:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.3042" x="55" y="539.856">&#8226; guardarSolicitud(), o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.6089" x="55" y="554.9888">&#8226; cerrarSolicitud() sin seguir editando.</text></g><!--link DecidirAccion to *end*editarSolicitudDispensa--><g class="link" data-entity-1="DecidirAccion" data-entity-2=".end.editarSolicitudDispensa" data-link-type="dependency" data-source-line="37" data-uid="lnk7" id="link_DecidirAccion_.end.editarSolicitudDispensa"><path d="M44,635.8738 C44,662.0438 44,696.4438 44,715.2738" fill="none" id="DecidirAccion-to-*end*editarSolicitudDispensa" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,721.2738,48,712.2738,44,716.2738,40,712.2738,44,721.2738" style="stroke:#008000;stroke-width:1;"/><path d="M49,658.5938 L49,698.5938 L322,698.5938 L322,668.5938 L312,658.5938 L49,658.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M312,658.5938 L312,668.5938 L322,668.5938 L312,658.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="675.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.7891" x="118.0386" y="675.6606">ejecuta la acci&#243;n elegida</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.8462" x="55" y="690.7935">(guardarSolicitud() o cerrarSolicitud()).</text></g><!--link SOLICITUD_DISPENSA_ABIERTA_INICIAL to editarSolicitudDispensa--><g class="link" data-entity-1="SOLICITUD_DISPENSA_ABIERTA_INICIAL" data-entity-2="editarSolicitudDispensa" data-link-type="dependency" data-source-line="8" data-uid="lnk2" id="link_SOLICITUD_DISPENSA_ABIERTA_INICIAL_editarSolicitudDispensa"><path d="M229,94.5569 C229,109.5269 229,124.5169 229,148.9069" fill="none" id="SOLICITUD_DISPENSA_ABIERTA_INICIAL-to-editarSolicitudDispensa" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="229,154.9069,233,145.9069,229,149.9069,225,145.9069,229,154.9069" style="stroke:#008000;stroke-width:1;"/></g><!--link editarSolicitudDispensa to SOLICITUD_DISPENSA_ABIERTA_FINAL--><g class="link" data-entity-1="editarSolicitudDispensa" data-entity-2="SOLICITUD_DISPENSA_ABIERTA_FINAL" data-link-type="dependency" data-source-line="45" data-uid="lnk8" id="link_editarSolicitudDispensa_SOLICITUD_DISPENSA_ABIERTA_FINAL"><path d="M229,753.8769 C229,785.2269 229,806.2269 229,824.3569" fill="none" id="editarSolicitudDispensa-to-SOLICITUD_DISPENSA_ABIERTA_FINAL" style="stroke:#008000;stroke-width:1;