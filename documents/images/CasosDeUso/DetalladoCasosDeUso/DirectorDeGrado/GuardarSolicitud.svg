.6606">Sistema valida</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.5234" x="179" y="321.7935">que todos los campos obligatorios</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.647" x="179" y="336.9263">est&#233;n completos y sean correctos.</text></g><!--link ValidarDatos to VerificarCambios--><g class="link" data-entity-1="ValidarDatos" data-entity-2="VerificarCambios" data-link-type="dependency" data-source-line="34" data-uid="lnk5" id="link_ValidarDatos_VerificarCambios"><path d="M168,407.9238 C168,434.4738 168,475.9638 168,502.4338" fill="none" id="ValidarDatos-to-VerificarCambios" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="168,508.4338,172,499.4338,168,503.4338,164,499.4338,168,508.4338" style="stroke:#008000;stroke-width:1;"/><path d="M173,430.5938 L173,485.5938 L403,485.5938 L403,440.5938 L393,430.5938 L173,430.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M393,430.5938 L393,440.5938 L403,440.5938 L393,430.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="118.1807" x="179" y="447.6606">Sistema verifica</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.79" x="179" y="462.7935">que se hayan realizado cambios</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.2671" x="179" y="477.9263">respecto al estado anterior.</text></g><!--link VerificarCambios to FinalizarOpciones--><g class="link" data-entity-1="VerificarCambios" data-entity-2="FinalizarOpciones" data-link-type="dependency" data-source-line="41" data-uid="lnk6" id="link_VerificarCambios_FinalizarOpciones"><path d="M168,548.9838 C168,579.8538 168,633.2338 168,658.1538" fill="none" id="VerificarCambios-to-FinalizarOpciones" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="168,664.1538,172,655.1538,168,659.1538,164,655.1538,168,664.1538" style="stroke:#008000;stroke-width:1;"/><path d="M173,571.5938 L173,641.5938 L365,641.5938 L365,581.5938 L355,571.5938 L173,571.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M355,571.5938 L355,581.5938 L365,581.5938 L355,571.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.9971" x="179" y="588.6606">Director confirma</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.2979" x="179" y="603.7935">la operaci&#243;n de guardado:</text><ellipse cx="184.5" cy="614.4922" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.1362" x="191" y="618.9263">Confirmar guardado</text><ellipse cx="184.5" cy="629.625" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.9502" x="191" y="634.0591">Cancelar operaci&#243;n</text></g><!--link FinalizarOpciones to *end*GuardarSolicitud--><g class="link" data-entity-1="FinalizarOpciones" data-entity-2=".end.GuardarSolicitud" data-link-type="dependency" data-source-line="49" data-uid="lnk8" id="link_FinalizarOpciones_.end.GuardarSolicitud"><path d="M177,679.9638 C203.27,686.8938 278,706.5938 278,706.5938 C278,706.5938 278,952.5938 278,952.5938 C278,952.5938 206.5948,969.6755 177.6348,976.6155" fill="none" id="FinalizarOpciones-to-*end*GuardarSolicitud" style="stroke:#FF0000;stroke-width:1;"/><polygon fill="#FF0000" points="171.8,978.0138,181.4844,979.8062,176.6623,976.8485,179.62,972.0265,171.8,978.0138" style="stroke:#FF0000;stroke-width:1;"/><path d="M283,809.5938 L283,864.5938 L562,864.5938 L562,819.5938 L552,809.5938 L283,809.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M552,809.5938 L552,819.5938 L562,819.5938 L552,809.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="168.4541" x="289" y="826.6606">Si selecciona Cancelar:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.0278" x="289" y="841.7935">Se descarta el guardado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.9844" x="289" y="856.9263">y se pierden los cambios no guardados.</text></g><!--link FinalizarOpciones to PersistirCambios--><g class="link" data-entity-1="FinalizarOpciones" data-entity-2="PersistirCambios" data-link-type="dependency" data-source-line="56" data-uid="lnk9" id="link_FinalizarOpciones_PersistirCambios"><path d="M158.79,680.0638 C132.67,687.0838 60,706.5938 60,706.5938 C60,706.5938 51.5953,774.629 47.1353,810.749" fill="none" id="FinalizarOpciones-to-PersistirCambios" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="46.4,816.7038,51.4728,808.2618,47.0127,811.7414,43.5331,807.2814,46.4,816.7038" style="stroke:#008000;stroke-width:1;"/><path d="M65,711.5938 L65,781.5938 L273,781.5938 L273,721.5938 L263,711.5938 L65,711.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M263,711.5938 L263,721.5938 L273,721.5938 L263,711.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="122.9287" x="71" y="728.6606">Sistema persiste</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.4336" x="71" y="743.7935">todos los cambios realizados</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" tex