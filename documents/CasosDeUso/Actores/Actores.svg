ngthAdjust="spacing" textLength="120.9927" x="566.17" y="196.7538">Director de Grado:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.0054" x="566.17" y="211.8866">Puede hacer todo lo que hace un Profesor,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.9521" x="566.17" y="227.0194">adem&#225;s de revisar y aprobar o rechazar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.2539" x="566.17" y="242.1522">las dispensas.</text></g><g class="entity" data-entity="GMN12" data-source-line="26" data-uid="ent0013" id="entity_GMN12"><path d="M215.02,45.6869 L215.02,76.9469 L155.23,80.9469 L215.02,84.9469 L215.02,116.2181 A0,0 0 0 0 215.02,116.2181 L500.1714,116.2181 A0,0 0 0 0 500.1714,116.2181 L500.1714,55.6869 L490.1714,45.6869 L215.02,45.6869 A0,0 0 0 0 215.02,45.6869" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M490.1714,45.6869 L490.1714,55.6869 L500.1714,55.6869 L490.1714,45.6869" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.8848" x="221.02" y="62.7538">Secretar&#237;a Acad&#233;mica:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.1514" x="221.02" y="77.8866">Gestiona matr&#237;culas y listas de alumnos,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.0249" x="221.02" y="93.0194">y registra/tramita las solicitudes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.812" x="221.02" y="108.1522">de dispensa de los alumnos.</text></g><!--reverse link Profesor to Director--><g class="link" data-entity-1="Profesor" data-entity-2="Director" data-source-line="10" data-uid="lnk5" id="link_Profesor_Director"><p