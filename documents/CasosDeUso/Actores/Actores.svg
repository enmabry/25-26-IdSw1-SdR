FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.9805" x="188.52" y="381.4938">Alumno:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.2837" x="188.52" y="396.6266">Puede solicitar una dispensa.</text></g><g class="entity" data-entity="GMN13" data-source-line="24" data-uid="ent0014" id="entity_GMN13"><path d="M123.92,155.8569 L123.92,211.2553 A0,0 0 0 0 123.92,211.2553 L452.4068,211.2553 A0,0 0 0 0 452.4068,211.2553 L452.4068,165.8569 L442.4068,155.8569 L149.67,155.8569 L64.29,139.1969 L141.67,155.8569 L123.92,155.8569 A0,0 0 0 0 123.92,155.8569" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M442.4068,155.8569 L442.4068,165.8569 L452.4068,165.8569 L442.4068,155.8569" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="58.1636" x="129.92" y="172.9238">Profesor:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.4868" x="129.92" y="188.0566">Puede consultar listas de alumnos y dispensas,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.7173" x="129.92" y="203.1894">y registrar la asistencia.</text></g><g class="entity" data-entity="GMN16" data-source-line="30" data-uid="ent0017" id="entity_GMN16"><path d="M512.41,43.2969 L512.41,76.1569 L347.58,81.9269 L512.41,84.1569 L512.41,113.8281 A0,0 0 0 0 512.41,113.8281 L810.4154,113.8281 A0,0 0 0 0 810.4154,113.8281 L810.4154,53.2969 L800.4154,43.2969 L512.41,43.2969 A0,0 0 0 0 512.41,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M800.4154,43.2969 L800.4154,53.2969 L810.4154,53.2969 L800.4154,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.9927" x="518.41" y="60.3638">Director de Grado:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.0054" x="518.41" y="75.4966">Puede hacer todo lo que hace un Profesor,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.9521" x="518.41" y="90.6294">adem&#225;s de revisar y aprobar o rechazar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.2539" x="518.41" y="105.7622">las dispensas.</text></g><g class="entity" data-entity="GMN19" data-source-line="37" data-uid="ent0020" id="entity_GMN19"><path d="M518.83,259.2969 L518.83,289.4069 L362.95,292.1569 L518.83,297.4069 L518.83,329.8281 A0,0 0 0 0 518.83,329.8281 L803.9814,329.8281 A0,0 0 0 0 803.9814,329.8281 L803.9814,269.2969 L793.9814,259.2969 L518.83,259.2969 A0,0 0 0 0 518.83,259.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M793.9814,259.2969 L793.9814,269.2969 L803.9814,269.2969 L793.9814,259.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.8848" x="524.83" y="276.3638">Secretar&#237;a Acad&#233;mica:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.1514" x="524.83" y="291.4966">Gestiona matr&#237;culas y listas de alumnos,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.0249" x="524.83" y="306.6294">y registra/tramita las solicitudes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.812" x="524.83" y="321.7622">de dispensa de los alumnos.</text></g><g class="entity" data-entity="GMN22" data-source-line="44" data-uid="ent0023" id="entity_GMN22"><path d="M870.41,143.7269 L870.41,182.5569 L711.3,186.5569 L870.41,190.5569 L870.41,229.3909 A0,0 0 0 0 870.41,229.3909 L1143.9134,229.3909 A0,0 0 0 0 1143.9134,229.3909 L1143.9134,153.7269 L1133.9134,143.7269 L870.41,143.7269 A0,0 0 0 0 870.41,143.7269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1133.9134,143.7269 L1133.9134,153.7269 L1143.9134,153.7269 L1133.9134,143.7269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.3921" x="876.41" y="160.7938">Administrador del sistema:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.5854" x="876.41" y="175.9266">Puede hacer todo lo que hacen</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.373" x="876.41" y="191.0594">Profesor, Director y Secretar&#237;a,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.1621" x="876.41" y="206.1922">adem&#225;s de crear y gestionar usuarios</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.5034" x="876.41" y="221.325">y la configuraci&#243;n general del sistema.</text></g><!--reverse link Profesor to Director--><g class="link" data-entity-1="Profesor" data-entity-2="Director" data-source-line="12" data-uid="lnk7" id="link_Profesor_Director"><path d="M81.9301,124.2255 C121.5801,116.1755 176.91,104.9469 228.54,94.4569" fill="none" id="Profesor-backto-Director" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="64.29,127.8069,83.1239,130.1055,80.7363,118.3454,64.29,127.8069" style="stroke:#181818;stroke-width:1;"/></g><!--reverse link Director to Admin--><g class="link" data-entity-1="Director" data-entity-2="Admin" data-source-line="15" data-uid="lnk8" id="link_Director_Admin"><path d="M364.913,103.7815 C437.713,124.1715 543.46,153.7969 611.52,172.8569" fill="none" id="Director-