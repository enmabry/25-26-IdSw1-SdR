 b&#250;squeda.</text></g><!--link DefinirFiltros to MostrarListado--><g class="link" data-entity-1="DefinirFiltros" data-entity-2="MostrarListado" data-link-type="dependency" data-source-line="25" data-uid="lnk5" id="link_DefinirFiltros_MostrarListado"><path d="M180.58,375.0638 C134.3,386.8438 41,410.5938 41,410.5938 C41,410.5938 41,566.5938 41,566.5938 C41,566.5938 41.5938,577.8921 42.4138,593.4321" fill="none" id="DefinirFiltros-to-MostrarListado" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="42.73,599.4237,46.2502,590.2255,42.4665,594.4307,38.2613,590.647,42.73,599.4237" style="stroke:#008000;stroke-width:1;"/><path d="M46,415.5938 L46,561.5938 L353,561.5938 L353,425.5938 L343,415.5938 L46,415.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M343,415.5938 L343,425.5938 L353,425.5938 L343,415.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="131.0029" x="52" y="432.6606">Director de Grado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.0073" x="187.1353" y="432.6606">define filtros como:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.4063" x="52" y="447.7935">&#8226; Estado (Pendiente, Aprobada, Rechazada)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.4009" x="52" y="462.9263">&#8226; Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.1831" x="52" y="478.0591">&#8226; Asignatura</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.4595" x="52" y="493.1919">&#8226; Rango de fechas</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="52" y="508.3247">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="52" y="523.4575">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.499" x="115.0386" y="523.4575">ejecuta la b&#250;squeda y presenta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.4966" x="52" y="538.5903">el listado de solicitudes que cumplen</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.4248" x="52" y="553.7231">los criterios indicados.</text></g><!--link MostrarListado to RevisarOpciones--><g class="link" data-entity-1="MostrarListado" data-entity-2="RevisarOpciones" data-link-type="dependency" data-source-line="38" data-uid="lnk6" id="link_MostrarListado_RevisarOpciones"><path d="M51.39,650.0138 C64.39,692.9838 90,777.5938 90,777.5938 C90,777.5938 320,795.5938 320,795.5938 C320,795.5938 321.0786,796.2615 328.5286,800.8415" fill="none" id="MostrarListado-to-RevisarOpciones" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="333.64,803.9838,328.0678,795.8627,329.3805,801.3652,323.8781,802.6779,333.64,803.9838" style="stroke:#008000;stroke-width:1;"/><path d="M95,687.5938 L95,772.5938 L353,772.5938 L353,697.5938 L343,687.5938 L95,687.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M343,687.5938 L343,697.5938 L353,697.5938 L343,687.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="131.0029" x="101" y="704.6606">Director de Grado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.5273" x="236.1353" y="704.6606">revisa el listado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73.9819" x="101" y="719.7935">y decide si:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.9492" x="101" y="734.9263">&#8226; cerrar la consulta,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.6323" x="101" y="750.0591">&#8226; modificar los filtros,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.124" x="101" y="765.1919">&#8226; o refrescar los resultados.</text></g><!--link RevisarOpciones to DefinirFiltros--><g class="link" data-entity-1="RevisarOpciones" data-entity-2="DefinirFiltros" data-link-type="dependency" data-source-line="47" data-uid="lnk7" id="link_RevisarOpciones_DefinirFiltros"><path d="M358.94,795.2338 C358.73,707.1837 358,410.5938 358,410.5938 C358,410.5938 280.4932,389.1822 237.2232,377.2222" fill="none" id="RevisarOpciones-to-DefinirFiltros" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="231.44,375.6238,239.0491,381.8769,236.2593,376.9558,241.1804,374.166,231.44,375.6238" style="stroke:#008000;stroke-width:1;"/><path d="M363,589.5938 L363,659.5938 L623,659.5938 L623,599.5938 L613,589.5938 L363,589.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M613,589.5938 L613,599.5938 L623,599.5938 L613,589.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="134.7607" x="369" y="606.6606">Si modifica filtros:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.1226" x="369" y="621.7935">el Sistema vuelve a la pantalla</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.4971" x="369" y="636.9263">de criterios de b&#250;squeda para lanzar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0059" x="369" y="652.0591">una nueva consulta.</text></g><!--link RevisarOpciones to RefrescarResultados--><g class="link" data-entity-1="RevisarOpciones" data-entity-2="RefrescarResultados" data-link-type="dependency" data-source-line="55" data-uid="lnk8" id="link_RevisarOpciones_RefrescarResultados"><path d="M333.64,837.2038 C326.19,841.7838 320,845.5938 320,845.5938 C320,845.5938 74,863.5938 74,863.5938 C74,863.5938 68.5145,908.7876 64.6745,940.3576" fill="none" id="RevisarOpciones-to-RefrescarResultados" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="63.95,946.3138,69.0074,937.8626,64.5537,941.3503,61.066,936.8966,63.95,946.3138" style="stroke:#008000;stroke-width:1;"/><path d="M79,868.5938 L79,923.5938 L389,923.5938 L389,878.5938 L379,868.5938 L79,868.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M379,868.5938 L379,878.5938 L389,878.5938 L379,868.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.0356" x="85" y="885.6606">Si refresca resultados:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.2246" x="85" y="900.7935">el Sistema vuelve a consultar la informaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.6299" x="85" y="915.9263">usando los mismos filtros actuales.</text></g><!--link RefrescarResultados to MostrarListado--><g class="link" data-entity-1="RefrescarResultados" data-entity-2="MostrarListado" data-link-type="dependency" data-source-line="62" data-uid="lnk9" id="link_RefrescarResultados_MostrarListado"><path d="M59.44,946.1938 C57.11,909.8138 53,845.5938 53,845.5938 C53,845.5938 47.5849,713.2487 45.2449,655.9687" fill="none" id="RefrescarResultados-to-MostrarListado" style="stroke:#008000;stroke-width:1;"/><p