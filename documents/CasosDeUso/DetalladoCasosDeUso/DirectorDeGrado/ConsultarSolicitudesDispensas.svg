 x="421" y="885.6606">Si cierra la consulta:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.0078" x="421" y="900.7935">el Sistema sale de la pantalla de b&#250;squeda</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.561" x="421" y="915.9263">y finaliza el caso de uso.</text></g><!--link DISPENSAS_ABIERTO_INICIAL to consultarSolicitudesDispensas--><g class="link" data-entity-1="DISPENSAS_ABIERTO_INICIAL" data-entity-2="consultarSolicitudesDispensas" data-link-type="dependency" data-source-line="7" data-uid="lnk2" id="link_DISPENSAS_ABIERTO_INICIAL_consultarSolicitudesDispensas"><path d="M366,94.5169 C366,109.1369 366,123.6669 366,148.0869" fill="none" id="DISPENSAS_ABIERTO_INICIAL-to-consultarSolicitudesDispensas" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="366,154.0869,370,145.0869,366,149.0869,362,145.0869,366,154.0869" style="stroke:#008000;stroke-width:1;"/></g><!--link consultarSolicitudesDispensas to DISPENSAS_ABIERTO_FINAL--><g class="link" data-entity-1="consultarSolicitudesDispensas" data-entity-2="DISPENSAS_ABIERTO_FINAL" data-link-type="dependency" data-source-line="76" data-uid="lnk12" id="link_consultarSolicitudesDispensas_DISPENSAS_ABIERTO_FINAL"><path d="M366,1007.0869 C366,1031.2669 366,1045.6169 366,1060.1769" fill="none" id="consultarSolicitudesDispensas-to-DISPENSAS_ABIERTO_FINAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="366,1066.1769,370,1057.1769,366,1061.1769,362,1057.1769,366,1066.1769" style="stroke:#008000;stroke-width:1;"/></g><!--SRC=[dLRDJjj04BxxAKRf1IgWTuIGKW9L90eewGqXD5bFw9Rrhhi_aQ2gr5TfNw4thhn9dwIp6zjnY1CKb8lZdPdzVcOcyT8hWXEZNL0UBJYZf90-vEGW9yYbAqaxpDozr2LQB419JVwX92YDUeXViinvz0I3uVZgz6BS7z_sFmvFHrykRuSNmvDX_npGGM_bjBSsxMnumKcmBYrRVz7-zRixIwHlzez1r9p62qg3YewhCMyCIW0sHkpizk17bZ5McDVhyOUp1ZILMjepgRmrRlNyit7UeZsN_3Otg-SZcac7zh8KqcXoNG5JIqwW7L52b_CjAUhw_SsI2Xr8jE4wHaSZ