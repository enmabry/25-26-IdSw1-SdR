<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="867px" preserveAspectRatio="none" style="width:431px;height:867px;background:#FFFFFF;" version="1.1" viewBox="0 0 431 867" width="431px" zoomAndPan="magnify"><title>Cerrar solicitud de dispensa</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="221.8125" x="94.5938" y="22.9951">Cerrar solicitud de dispensa</text></g><g id="SOLICITUD_DISPENSA_ABIERTA_INICIAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.3516" x="92.82" y="44.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="92.82" x2="332.1716" y1="70.5938" y2="70.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3516" x="102.82" y="62.292">SOLICITUD_DISPENSA_ABIERTA</text></g><g id="DISPENSAS_ABIERTO_FINAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="167.3623" x="128.82" y="811.5969"/><line style="stroke:#181818;stroke-width:0.5;" x1="128.82" x2="296.1823" y1="837.8938" y2="837.8938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.3623" x="138.82" y="829.592">DISPENSAS_ABIERTO</text></g><path d="M19.5,154.2969 L405.5,154.2969 A12.5,12.5 0 0 1 418,166.7969 L418,180.5938 L7,180.5938 L7,166.7969 A12.5,12.5 0 0 1 19.5,154.2969" fill="#F1F1F1"/><rect fill="none" height="597.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="411" x="7" y="154.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="418" y1="180.5938" y2="180.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.1484" x="155.9258" y="172.292">cerrarSolicitud()</text><g id="cerrarSolicitud.VerificarCambios"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="312.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="338.8906" y2="338.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="330.5889">&#160;</text></g><g id="cerrarSolicitud.ConfirmarCierre"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="508.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="534.8906" y2="534.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="526.5889">&#160;</text></g><ellipse cx="44" cy="201.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="730.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="730.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*cerrarSolicitud to VerificarCambios--><g class="link" data-entity-1=".start.cerrarSolicitud" data-entity-2="VerificarCambios" data-link-type="dependency" data-source-line="15" data-uid="lnk4" id="link_.start.cerrarSolicitud_VerificarCambios"><path d="M44,211.8038 C44,232.2638 44,276.0638 44,306.1938" fill="none" id="*start*cerrarSolicitud-to-VerificarCambios" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,312.1938,48,303.1938,44,307.1938,40,303.1938,44,312.1938" style="stroke:#008000;stroke-width:1;"/><path d="M49,234.5938 L49,289.5938 L352,289.5938 L352,244.5938 L342,234.5938 L49,234.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M342,234.5938 L342,244.5938 L352,244.5938 L342,234.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="200.3066" x="55" y="251.6606">Alumno / Director de Grado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="68.4468" x="259.439" y="251.6606">selecciona</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.2803" x="55" y="266.7935">la opci&#243;n "Cerrar solicitud" desde el detalle</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.0903" x="55" y="281.9263">de la dispensa.</text></g><!--link VerificarCambios to ConfirmarCierre--><g class="link" data-entity-1="VerificarCambios" data-entity-2="ConfirmarCierre" data-link-type="dependency" data-source-line="22" data-uid="lnk5" id="link_VerificarCambios_ConfirmarCierre"><path d="M44,362.7738 C44,399.9438 44,464.7538 44,502.1138" fill="none" id="VerificarCambios-to-ConfirmarCierre" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,508.1138,48,499.1138,44,503.1138,40,499.1138,44,508.1138" style="stroke:#008000;stroke-width:1;"/><path d="M49,385.5938 L49,485.5938 L409,485.5938 L409,395.5938 L399,385.5938 L49,385.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M399,385.5938 L399,395.5938 L409,395.5938 L399,385.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="402.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.377" x="118.0386" y="402.6606">comprueba si existen cambios</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.7642" x="55" y="417.7935">sin guardar en la solicitud.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="55" y="432.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.4277" x="55" y="448.0591">&#8226; Si hay cambios &#8594; muestra un mensaje</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7197" x="63.2646" y="463.1919">de advertencia pidiendo confirmaci&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.5996" x="55" y="478.3247">&#8226; Si no hay cambios &#8594; permite cerrar directamente.</text></g><!--link ConfirmarCierre to *end*cerrarSolicitud--><g class="link" data-entity-1="ConfirmarCierre" data-entity-2=".end.cerrarSolicitud" data-link-type="dependency" data-source-line="32" data-uid="lnk7" id="link_ConfirmarCierre_.end.cerrarSolicitud"><path d="M44,558.8938 C44,601.7738 44,683.1737 44,713.1938" fill="none" id="ConfirmarCierre-to-*end*cerrarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,719.1938,48,710.1938,44,714.1938,40,710.1938,44,719.1938" style="stroke:#008000;stroke-width:1;"/><path d="M49,581.5938 L49,696.5938 L371,696.5938 L371,591.5938 L361,581.5938 L49,581.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M361,581.5938 L361,591.5938 L371,591.5938 L361,581.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="153.2197" x="55" y="598.6606">Si confirma el cierre:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.7295" x="55" y="613.7935">el sistema descarta los cambios no guardados</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.4268" x="55" y="628.9263">(si los hubiera) y cierra la solicitud.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="55" y="644.0591">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.0283" x="55" y="659.1919">Si cancela:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.793" x="55" y="674.3247">permanece en SOLICITUD_DISPENSA_ABIERTA</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.646" x="55" y="689.4575">(no se ejecuta esta transici&#243;n).</text></g><!--link SOLICITUD_DISPENSA_ABIERTA_INICIAL to cerrarSolicitud--><g class="link" data-entity-1="SOLICITUD_DISPENSA_ABIERTA_INICIAL" data-entity-2="cerrarSolicitud" data-link-type="dependency" data-source-line="8" data-uid="lnk2" id="link_SOLICITUD_DISPENSA_ABIERTA_INICIAL_cerrarSolicitud"><path d="M212.5,94.7569 C212.5,109.5569 212.5,124.1969 212.5,148.1569" fill="none" id="SOLICITUD_DISPENSA_ABIERTA_INICIAL-to-cerrarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="212.5,154.1569,216.5,145.1569,212.5,149.1569,208.5,145.1569,212.5,154.1569" style="stroke:#008000;stroke-width:1;"/></g><!--link cerrarSolicitud to DISPENSAS_ABIERTO_FINAL--><g class="link" data-entity-1="cerrarSolicitud" data-entity-2="DISPENSAS_ABIERTO_FINAL" data-link-type="dependency" data-source-line="44" data-uid="lnk8" id="link_cerrarSolicitud_DISPENSAS_ABIERTO_FINAL"><path d="M212.5,751.8469 C212.5,775.8469 212.5,790.5169 212.5,805.3069" fill="none" id="cerrarSolicitud-to-DISPENSAS_ABIERTO_FINAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="212.5,811.3069,216.5,802.3069,212.5,806.3069,208.5,802.3069,212.5,811.3069" style="stroke:#008000;stroke-width:1;"/></g><!--SRC=[ZLHDQjj05Dxh50zb4nVYx4imk7PQ1C4fLTfD2EPvz9AyP3GZPaQbfXIwwW5wX5wXHyXDSfA-qO-n5JjKsaZlz_iPAN3G13Do3Xrugrbng0ie20hs5HcFIU8VsLJei0JDXiAw8gYiNiSNIGOC1FdbHJRBhZxFb_Ci_tY-oAVBwRli_DFLT9aj93Ez0FIG7YvBkq5zFEyIbyltsKAwjwuuw4LPcYJ_WU7a-kZE4PcRamceXdFUK-wP3CBDja7iU9J2zoI