<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1154px" preserveAspectRatio="none" style="width:450px;height:1154px;background:#FFFFFF;" version="1.1" viewBox="0 0 450 1154" width="450px" zoomAndPan="magnify"><title>Guardar solicitud de dispensa (Director de Grado)</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="394.8164" x="17.5918" y="22.9951">Guardar solicitud de dispensa (Director de Grado)</text></g><g id="SOLICITUD_DISPENSA_ABIERTA_INICIAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.3516" x="102.32" y="44.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="102.32" x2="341.6716" y1="70.5938" y2="70.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3516" x="112.32" y="62.292">SOLICITUD_DISPENSA_ABIERTA</text></g><g id="DISPENSAS_ABIERTO_FINAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="167.3623" x="138.32" y="1098.5969"/><line style="stroke:#181818;stroke-width:0.5;" x1="138.32" x2="305.6823" y1="1124.8938" y2="1124.8938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.3623" x="148.32" y="1116.592">DISPENSAS_ABIERTO</text></g><path d="M19.5,154.2969 L424.5,154.2969 A12.5,12.5 0 0 1 437,166.7969 L437,180.5938 L7,180.5938 L7,166.7969 A12.5,12.5 0 0 1 19.5,154.2969" fill="#F1F1F1"/><rect fill="none" height="884.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="430" x="7" y="154.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="437" y1="180.5938" y2="180.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.3076" x="158.8462" y="172.292">guardarSolicitud()</text><g id="guardarSolicitud.ValidarDatos"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="342.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="368.8906" y2="368.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="360.5889">&#160;</text></g><g id="guardarSolicitud.VerificarCambios"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="493.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="519.8906" y2="519.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="511.5889">&#160;</text></g><g id="guardarSolicitud.ConfirmarOperacion"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="659.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="685.8906" y2="685.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="677.5889">&#160;</text></g><g id="guardarSolicitud.PersistirCambios"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="855.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="881.8906" y2="881.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="873.5889">&#160;</text></g><ellipse cx="44" cy="201.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="1017.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="1017.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*guardarSolicitud to ValidarDatos--><g class="link" data-entity-1=".start.guardarSolicitud" data-entity-2="ValidarDatos" data-link-type="dependency" data-source-line="17" data-uid="lnk4" id="link_.start.guardarSolicitud_ValidarDatos"><path d="M44,211.8837 C44,236.7537 44,299.4538 44,336.3837" fill="none" id="*start*guardarSolicitud-to-ValidarDatos" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,342.3837,48,333.3837,44,337.3837,40,333.3837,44,342.3837" style="stroke:#008000;stroke-width:1;"/><path d="M49,234.5938 L49,319.5938 L428,319.5938 L428,244.5938 L418,234.5938 L49,234.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M418,234.5938 L418,244.5938 L428,244.5938 L418,234.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="131.0029" x="55" y="251.6606">Director de Grado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.1553" x="190.1353" y="251.6606">selecciona "Guardar solicitud"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.7749" x="55" y="266.7935">tras realizar cambios sobre la dispensa.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="55" y="281.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="297.0591">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.2437" x="118.0386" y="297.0591">valida que todos los campos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.9473" x="55" y="312.1919">obligatorios est&#233;n completos y en un formato correcto.</text></g><!--link ValidarDatos to VerificarCambios--><g class="link" data-entity-1="ValidarDatos" data-entity-2="VerificarCambios" data-link-type="dependency" data-source-line="26" data-uid="lnk5" id="link_ValidarDatos_VerificarCambios"><path d="M44,392.8638 C44,420.5738 44,459.6337 44,487.3338" fill="none" id="ValidarDatos-to-VerificarCambios" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,493.3338,48,484.3338,44,488.3338,40,484.3338,44,493.3338" style="stroke:#008000;stroke-width:1;"/><path d="M49,415.5938 L49,470.5938 L420,470.5938 L420,425.5938 L410,415.5938 L49,415.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M410,415.5938 L410,425.5938 L420,425.5938 L410,415.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="432.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.5513" x="118.0386" y="432.6606">comprueba si efectivamente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.7588" x="55" y="447.7935">se han realizado cambios respecto a la versi&#243;n previa</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.5229" x="55" y="462.9263">de la solicitud.</text></g><!--link VerificarCambios to ConfirmarOperacion--><g class="link" data-entity-1="VerificarCambios" data-entity-2="ConfirmarOperacion" data-link-type="dependency" data-source-line="33" data-uid="lnk6" id="link_VerificarCambios_ConfirmarOperacion"><path d="M44,543.7938 C44,574.8038 44,622.2438 44,653.2938" fill="none" id="VerificarCambios-to-ConfirmarOperacion" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,659.2938,48,650.2938,44,654.2938,40,650.2938,44,659.2938" style="stroke:#008000;stroke-width:1;"/><path d="M49,566.5938 L49,636.5938 L381,636.5938 L381,576.5938 L371,566.5938 L49,566.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M371,566.5938 L371,576.5938 L381,576.5938 L371,566.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="583.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.4917" x="118.0386" y="583.6606">presenta un resumen de la operaci&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.7173" x="55" y="598.7935">El Director puede:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.9673" x="55" y="613.9263">&#8226; confirmar el guardado, o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.6636" x="55" y="629.0591">&#8226; cancelar la operaci&#243;n.</text></g><!--link ConfirmarOperacion to PersistirCambios--><g class="link" data-entity-1="ConfirmarOperacion" data-entity-2="PersistirCambios" data-link-type="dependency" data-source-line="41" data-uid="lnk7" id="link_ConfirmarOperacion_PersistirCambios"><path d="M44,709.7738 C44,746.9438 44,811.7538 44,849.1138" fill="none" id="ConfirmarOperacion-to-PersistirCambios" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,855.1138,48,846.1138,44,850.1138,40,846.1138,44,855.1138" style="stroke:#008000;stroke-width:1;"/><path d="M49,732.5938 L49,832.5938 L349,832.5938 L349,742.5938 L339,732.5938 L49,732.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M339,732.5938 L339,742.5938 L349,742.5938 L339,732.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="180.6606" x="55" y="749.6606">Si confirma el guardado:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.3223" x="55" y="764.7935">el Sistema procede a persistir los cambios.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="55" y="779.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.0283" x="55" y="795.0591">Si cancela:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.106" x="55" y="810.1919">se descarta el guardado y se pierden</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.9102" x="55" y="825.3247">los cambios no confirmados.</text></g><!--link PersistirCambios to *end*guardarSolicitud--><g class="link" data-entity-1="PersistirCambios" data-entity-2=".end.guardarSolicitud" data-link-type="dependency" data-source-line="51" data-uid="lnk9" id="link_PersistirCambios_.end.guardarSolicitud"><path d="M44,906.0438 C44,935.8238 44,978.8038 44,1000.1338" fill="none" id="PersistirCambios-to-*end*guardarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,1006.1338,48,997.1338,44,1001.1338,40,997.1338,44,1006.1338" style="stroke:#008000;stroke-width:1;"/><path d="M49,928.5938 L49,983.5938 L395,983.5938 L395,938.5938 L385,928.5938 L49,928.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M385,928.5938 L385,938.5938 L395,938.5938 L385,928.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="945.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.8818" x="118.0386" y="945.6606">guarda los cambios en la base de datos,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2026" x="55" y="960.7935">actualiza el registro de la solicitud</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.0034" x="55" y="975.9263">y muestra un mensaje de confirmaci&#243;n.</text></g><!--link SOLICITUD_DISPENSA_ABIERTA_INICIAL to guardarSolicitud--><g class="link" data-entity-1="SOLICITUD_DISPENSA_ABIERTA_INICIAL" data-entity-2="guardarSolicitud" data-link-type="dependency" data-source-line="8" data-uid="lnk2" id="link_SOLICITUD_DISPENSA_ABIERTA_INICIAL_guardarSolicitud"><path d="M222,94.5769 C222,109.1469 222,123.5869 222,147.9369" fill="none" id="SOLICITUD_DISPENSA_ABIERTA_INICIAL-to-guardarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="222,153.9369,226,144.9369,222,148.9369,218,144.9369,222,153.9369" style="stroke:#008000;stroke-width:1;"/></g><!--link guardarSolicitud to DISPENSAS_ABIERTO_FINAL--><g class="link" data-entity-1="guardarSolicitud" data-entity-2="DISPENSAS_ABIERTO_FINAL" data-link-type="dependency" data-source-line="59" data-uid="lnk10" id="link_guardarSolicitud_DISPENSAS_ABIERTO_FINAL"><path d="M222,1039.0969 C222,1063.3269 222,1077.6769 222,1092.2169" fill="none" id="guardarSolicitud-to-DISPENSAS_ABIERTO_FINAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="222,1098.2169,226,1089.2169,222,1093.2169,218,1089.2169,222,1098.2169" style="stroke:#008000;stroke-width:1;"/></g><!--SRC=[ZLN1RjD04BtxAqRcqg8MxbLLAIIXYbIr5IbSgYeQUoTXgRrhTjUH0aBYMxXnvXFw9tm9i_RQsB43JHGfsNapyzwRMST9bn5SbcW46h0wawbqfG118AGjI5c4evaqb3fj_EcbGQ6FeyW-IbMWmHmogSZj2e92Ppl_WuCE7S7ovcenNTozdwrcY-Nj_7evMKtUBERlxYQhnJL79bU05kB3i3WKQiwN8N2pUhkuvkpEonSQmE8eUWQ7q_iN6qEa7aulO5CRiMnyQAJidrVzzW-FZcFu6aMUJfqLyvk17p2JZ9kXqtOaIaQkPOfcYdaYnn1JhTRIv6Xk2ZAOIgs6c5ioLbedsoeLvFxbGq_UW8dIN48hFyF7g7RoFBaOpFlyTN81bZ9AVNU4UB0mSSXsXiaOuZvVE9pMP1YM688Csvrw5U1_UowPFULOTTfMDE5pIU2quFoCFroh2Am1T9B93QimlZfPz_HJGQhp8YDM1ZiW1Q