183" y="306.6606">Sistema muestra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.998" x="183" y="321.7935">los datos completos de la solicitud:</text><ellipse cx="188.5" cy="332.4922" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.6006" x="195" y="336.9263">Alumno</text><ellipse cx="188.5" cy="347.625" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6255" x="195" y="352.0591">Asignatura / actividad</text><ellipse cx="188.5" cy="362.7578" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.6162" x="195" y="367.1919">Motivo de la dispensa</text><ellipse cx="188.5" cy="377.8906" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.7715" x="195" y="382.3247">Documentaci&#243;n adjunta</text></g><!--link RevisarSolicitud to EvaluarCriterios--><g class="link" data-entity-1="RevisarSolicitud" data-entity-2="EvaluarCriterios" data-link-type="dependency" data-source-line="39" data-uid="lnk5" id="link_RevisarSolicitud_EvaluarCriterios"><path d="M172,452.9238 C172,479.4738 172,520.9638 172,547.4337" fill="none" id="RevisarSolicitud-to-EvaluarCriterios" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="172,553.4337,176,544.4337,172,548.4337,168,544.4337,172,553.4337" style="stroke:#008000;stroke-width:1;"/><path d="M177,475.5938 L177,530.5938 L423,530.5938 L423,485.5938 L413,475.5938 L177,475.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M413,475.5938 L413,485.5938 L423,485.5938 L413,475.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="116.3145" x="183" y="492.6606">Director analiza</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.1958" x="183" y="507.7935">la informaci&#243;n y la documentaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.25" x="183" y="522.9263">presentada por el alumno.</text></g><!--link EvaluarCriterios to FinalizarOpciones--><g class="link" data-entity-1="EvaluarCriterios" data-entity-2="FinalizarOpciones" data-link-type="dependency" data-source-line="47" data-uid="lnk6" id="link_EvaluarCriterios_FinalizarOpciones"><path d="M172,593.9838 C172,624.8538 172,678.2338 172,703.1538" fill="none" id="EvaluarCriterios-to-FinalizarOpciones" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="172,709.1538,176,700.1538,172,704.1538,168,700.1538,172,709.1538" style="stroke:#008000;stroke-width:1;"/><path d="M177,616.5938 L177,686.5938 L409,686.5938 L409,626.5938 L399,616.5938 L177,616.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M399,616.5938 L399,626.5938 L409,626.5938 L399,616.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="140.918" x="183" y="633.6606">Director selecciona</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.2119" x="183" y="648.7935">una de las opciones disponibles:</text><ellipse cx="188.5" cy="659.4922" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0063" x="195" y="663.9263">Aprobar</text><ellipse cx="188.5" cy="674.625" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.9502" x="195" y="679.0591">Cancelar operaci&#243;n</text></g><!