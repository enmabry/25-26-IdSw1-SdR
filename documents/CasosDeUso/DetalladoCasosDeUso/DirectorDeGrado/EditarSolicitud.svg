<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1140px" preserveAspectRatio="none" style="width:406px;height:1140px;background:#FFFFFF;" version="1.1" viewBox="0 0 406 1140" width="406px" zoomAndPan="magnify"><title>Editar solicitud de dispensa (Director de Grado)</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="378.0615" x="10" y="22.9951">Editar solicitud de dispensa (Director de Grado)</text></g><g id="SOLICITUD_DISPENSA_ABIERTA_INICIAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.3516" x="86.3508" y="44.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="86.3508" x2="325.7023" y1="70.5938" y2="70.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3516" x="96.3508" y="62.292">SOLICITUD_DISPENSA_ABIERTA</text></g><g id="DISPENSAS_ABIERTO_FINAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="167.3623" x="122.3508" y="1084.5969"/><line style="stroke:#181818;stroke-width:0.5;" x1="122.3508" x2="289.7131" y1="1110.8938" y2="1110.8938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.3623" x="132.3508" y="1102.592">DISPENSAS_ABIERTO</text></g><path d="M34.5308,154.2969 L377.5308,154.2969 A12.5,12.5 0 0 1 390.0308,166.7969 L390.0308,180.5938 L22.0308,180.5938 L22.0308,166.7969 A12.5,12.5 0 0 1 34.5308,154.2969" fill="#F1F1F1"/><rect fill="none" height="870.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="368" x="22.0308" y="154.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="22.0308" x2="390.0308" y1="180.5938" y2="180.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.415" x="117.8232" y="172.292">editarSolicitudDispensa()</text><g id="editarSolicitudDispensa.RevisarSolicitud"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="34.0308" y="418.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="34.0308" x2="84.0308" y1="444.8906" y2="444.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="56.8057" y="436.5889">&#160;</text></g><g id="editarSolicitudDispensa.ModificarEstadoYDatos"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="34.0308" y="584.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="34.0308" x2="84.0308" y1="610.8906" y2="610.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="56.8057" y="602.5889">&#160;</text></g><g id="editarSolicitudDispensa.GuardarOCancelar"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="34.0308" y="750.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="34.0308" x2="84.0308" y1="776.8906" y2="776.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="56.8057" y="768.5889">&#160;</text></g><ellipse cx="59.0308" cy="201.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="59.0308" cy="1003.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="59.0308" cy="1003.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*editarSolicitudDispensa to RevisarSolicitud--><g class="link" data-entity-1=".start.editarSolicitudDispensa" data-entity-2="RevisarSolicitud" data-link-type="dependency" data-source-line="16" data-uid="lnk4" id="link_.start.editarSolicitudDispensa_RevisarSolicitud"><path d="M59.0308,212.0037 C59.0308,246.4037 59.0308,360.0938 59.0308,412.1238" fill="none" id="*start*editarSolicitudDispensa-to-RevisarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="59.0308,418.1238,63.0308,409.1238,59.0308,413.1238,55.0308,409.1238,59.0308,418.1238" style="stroke:#008000;stroke-width:1;"/><path d="M64.0308,234.5938 L64.0308,395.5938 L336.0308,395.5938 L336.0308,244.5938 L326.0308,234.5938 L64.0308,234.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M326.0308,234.5938 L326.0308,244.5938 L336.0308,244.5938 L326.0308,234.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="131.0029" x="70.0308" y="251.6606">Director de Grado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.5684" x="205.166" y="251.6606">abre una solicitud</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.8398" x="70.0308" y="266.7935">de dispensa pendiente para editarla.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="70.0308" y="281.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="70.0308" y="297.0591">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.3096" x="133.0693" y="297.0591">muestra los datos completos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.7705" x="70.0308" y="312.1919">de la solicitud:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.4009" x="70.0308" y="327.3247">&#8226; Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.4258" x="70.0308" y="342.4575">&#8226; Asignatura / actividad</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.4165" x="70.0308" y="357.5903">&#8226; Motivo de la dispensa</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.5718" x="70.0308" y="372.7231">&#8226; Documentaci&#243;n adjunta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.2168" x="70.0308" y="387.856">&#8226; Estado actual</text></g><!--link RevisarSolicitud to ModificarEstadoYDatos--><g class="link" data-entity-1="RevisarSolicitud" data-entity-2="ModificarEstadoYDatos" data-link-type="dependency" data-source-line="30" data-uid="lnk5" id="link_RevisarSolicitud_ModificarEstadoYDatos"><path d="M59.0308,468.7938 C59.0308,499.8038 59.0308,547.2438 59.0308,578.2938" fill="none" id="RevisarSolicitud-to-ModificarEstadoYDatos" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="59.0308,584.2938,63.0308,575.2938,59.0308,579.2938,55.0308,575.2938,59.0308,584.2938" style="stroke:#008000;stroke-width:1;"/><path d="M64.0308,491.5938 L64.0308,561.5938 L369.0308,561.5938 L369.0308,501.5938 L359.0308,491.5938 L64.0308,491.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M359.0308,491.5938 L359.0308,501.5938 L369.0308,501.5938 L359.0308,491.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="131.0029" x="70.0308" y="508.6606">Director de Grado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.3037" x="205.166" y="508.6606">modifica la solicitud:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.5146" x="70.0308" y="523.7935">&#8226; cambia el estado (Aprobada / Rechazada)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.2021" x="70.0308" y="538.9263">&#8226; a&#241;ade o edita observaciones</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.1978" x="70.0308" y="554.0591">&#8226; actualiza otros campos editables.</text></g><!--link ModificarEstadoYDatos to GuardarOCancelar--><g class="link" data-entity-1="ModificarEstadoYDatos" data-entity-2="GuardarOCancelar" data-link-type="dependency" data-source-line="38" data-uid="lnk6" id="link_ModificarEstadoYDatos_GuardarOCancelar"><path d="M59.0308,634.7938 C59.0308,665.8038 59.0308,713.2438 59.0308,744.2938" fill="none" id="ModificarEstadoYDatos-to-GuardarOCancelar" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="59.0308,750.2938,63.0308,741.2938,59.0308,745.2938,55.0308,741.2938,59.0308,750.2938" style="stroke:#008000;stroke-width:1;"/><path d="M64.0308,657.5938 L64.0308,727.5938 L342.0308,727.5938 L342.0308,667.5938 L332.0308,657.5938 L64.0308,657.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M332.0308,657.5938 L332.0308,667.5938 L342.0308,667.5938 L332.0308,657.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="70.0308" y="674.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.6382" x="133.0693" y="674.6606">valida los cambios realizados.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.7173" x="70.0308" y="689.7935">El Director puede:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.8838" x="70.0308" y="704.9263">&#8226; guardar cambios, o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.6636" x="70.0308" y="720.0591">&#8226; cancelar la operaci&#243;n.</text></g><!--link GuardarOCancelar to *end*editarSolicitudDispensa--><g class="link" data-entity-1="GuardarOCancelar" data-entity-2=".end.editarSolicitudDispensa" data-link-type="dependency" data-source-line="46" data-uid="lnk8" id="link_GuardarOCancelar_.end.editarSolicitudDispensa"><path d="M59.0308,800.7838 C59.0308,849.7438 59.0308,952.8138 59.0308,986.4938" fill="none" id="GuardarOCancelar-to-*end*editarSolicitudDispensa" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="59.0308,992.4938,63.0308,983.4938,59.0308,987.4938,55.0308,983.4938,59.0308,992.4938" style="stroke:#008000;stroke-width:1;"/><path d="M64.0308,823.5938 L64.0308,969.5938 L381.0308,969.5938 L381.0308,833.5938 L371.0308,823.5938 L64.0308,823.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M371.0308,823.5938 L371.0308,833.5938 L381.0308,833.5938 L371.0308,823.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="140.3467" x="70.0308" y="840.6606">Si guarda cambios:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.8521" x="70.0308" y="855.7935">&#8226; el Sistema actualiza el estado y los datos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.5229" x="78.2954" y="870.9263">de la solicitud,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.5" x="70.0308" y="886.0591">&#8226; registra fecha y responsable,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.6953" x="70.0308" y="901.1919">&#8226; y puede notificar al alumno.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="70.0308" y="916.3247">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.0283" x="70.0308" y="931.4575">Si cancela:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.5522" x="70.0308" y="946.5903">&#8226; el Sistema descarta los cambios</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.1011" x="78.2954" y="961.7231">y la solicitud permanece sin modificaciones.</text></g><!--link SOLICITUD_DISPENSA_ABIERTA_INICIAL to editarSolicitudDispensa--><g class="link" data-entity-1="SOLICITUD_DISPENSA_ABIERTA_INICIAL" data-entity-2="editarSolicitudDispensa" data-link-type="dependency" data-source-line="8" data-uid="lnk2" id="link_SOLICITUD_DISPENSA_ABIERTA_INICIAL_editarSolicitudDispensa"><path d="M206.0308,94.5969 C206.0308,109.1569 206.0308,123.5469 206.0308,147.8169" fill="none" id="SOLICITUD_DISPENSA_ABIERTA_INICIAL-to-editarSolicitudDispensa" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="206.0308,153.8169,210.0308,144.8169,206.0308,148.8169,202.0308,144.8169,206.0308,153.8169" style="stroke:#008000;stroke-width:1;"/></g><!--link editarSolicitudDispensa to DISPENSAS_ABIERTO_FINAL--><g class="link" data-entity-1="editarSolicitudDispensa" data-entity-2="DISPENSAS_ABIERTO_FINAL" data-link-type="dependency" data-source-line="60" data-uid="lnk9" id="link_editarSolicitudDispensa_DISPENSAS_ABIERTO_FINAL"><path d="M206.0308,1025.0569 C206.0308,1049.2769 206.0308,1063.6369 206.0308,1078.1869" fill="none" id="editarSolicitudDispensa-to-DISPENSAS_ABIERTO_FINAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="206.0308,1084.1869,210.0308,1075.1869,206.0308,1079.1869,202.0308,1075.1869,206.0308,1084.1869" style="stroke:#008000;stroke-width:1;"/></g><!--SRC=[bLLRRjim4FpNAHRkJrBayHy40TpO3GpaKSJfHn44nbhSk6meKY0f0q