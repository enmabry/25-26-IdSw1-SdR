"12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="150" y="508.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="172.7749" y="533.4404">&#160;</text><g class="entity" data-entity="FinalizarOpciones" data-uid="ent0007" id="entity_FinalizarOpciones"><polygon fill="#F1F1F1" points="175,664.5938,187,676.5938,175,688.5938,163,676.5938,175,664.5938" style="stroke:#181818;stroke-width:0.5;"/></g><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="817.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="841.9404">&#160;</text><ellipse cx="175" cy="256.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="168" cy="966.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="168" cy="966.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*RechazarDispensa to RevisarSolicitud--><g class="link" data-entity-1=".start.RechazarDispensa" data-entity-2="RevisarSolicitud" data-link-type="dependency" data-source-line="28" data-uid="lnk4" id="link_.start.RechazarDispensa_RevisarSolicitud"><path d="M175,266.8738 C175,287.7838 175,332.9738 175,361.1738" fill="none" id="*start*RechazarDispensa-to-RevisarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="175,367.1738,179,358.1738,175,362.1738,171,358.1738,175,367.1738" style="stroke:#008000;stroke-width:1;"/><path d="M180,289.5938 L180,344.5938 L425,344.5938 L425,299.5938 L415,289.5938 L180,289.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M415,289.5938 L415,299.5938 L425,299.5938 L415,289.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124.1855" x="186" y="306.6606">Sistema muestra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.6182" x="186" y="321.7935">los datos completos de la solicitud</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.7354" x="186" y="336.9263">para ser evaluada.</text></g><!--link RevisarSolicitud to IntroducirMotivoRechazo--><g class="link" data-entity-1="RevisarSolicitud" data-entity-2="IntroducirMotivoRechazo" data-link-type="dependency" data-source-line="36" data-uid="lnk5" id="link_RevisarSolicitud_IntroducirMotivoRechazo"><path d="M175,407.9238 C175,434.4738 175,475.9638 175,502.4338" fill="none" id="RevisarSolicitud-to-IntroducirMotivoRechazo" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="175,508.4338,179,499.4338,175,503.4338,171,499.4338,175,508.4338" style="stroke:#008000;stroke-width:1;"/><path d="M180,430.5938 L180,485.5938 L419,485.5938 L419,440.5938 L409,430.5938 L180,430.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M409,430.5938 L409,440.5938 L419,440.5938 L409,430.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="180.9082" x="186" y="447.6606">Director decide rechazar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.4609" x="186" y="462.7935">e introduce el motivo del rechazo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.9995" x="186" y="477.9263">(campo obligatorio).</text></g><!--link IntroducirMotivoRechazo to FinalizarOpciones--><g class="link" data-entity-1="IntroducirMotivoRechazo" data-entity-2="FinalizarOpciones" data-link-type="dependency" data-source-line="44" data-uid="lnk6" id="link_IntroducirMotivoRechazo_FinalizarOpciones"><path d="M175,548.9838 C175,579.8538 175,633.2338 175,658.1538" fill="none" id="IntroducirMotivoRechazo-to-FinalizarOpciones" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="175,664.1538,179,655.1538,175,659.1538,171,655.1538,175,664.1538" style="stroke:#008000;stroke-width:1;"/><path d="M180,571.5938 L180,641.5938 L341,641.5938 L341,581.5938 L331,571.5938 L180,571.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M331,571.5938 L331,581.5938 L341,581.5938 L331,571.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="140.918" x="186" y="588.6606">Director selecciona</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.7515" x="186" y="603.7935">una de las opciones:</text><ellipse cx="191.5" cy="614.4922" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.3833" x="198" y="618.9263">Confirmar rechazo</text><ellipse cx="191.5" cy="629.625" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.9502" x="198" y="634.0591">Cancelar operaci&#243;n</text></g><!--link FinalizarOpciones to *end*RechazarDispensa--><g class="link" data-entity-1="FinalizarOpciones" data-entity-2=".end.RechazarDispensa" data-link-type="dependency" data-source-line="53" data-uid="lnk8" id="link_FinalizarOpciones_.end.RechazarDispensa"><path d="M184.18,679.8738 C211.76,686.7038 292,706.5938 292,706.5938 C292,706.5938 292,937.5938 292,937.5938 C292,937.5938 214.4127,955.1125 184.4227,961.8825" fill="none" id="FinalizarOpciones-to-*end*RechazarDispensa" style="stroke:#FF0000;stroke-width:1;"/><polygon fill="#FF0000" points="178.57,963.2038,188.2299,965.1238,183.4473,962.1027,186.4683,957.3201,178.57,963.2038" style="stroke:#FF0000;stroke-width:1;"/><path d="M297,809.5938 L297,864.5938 L551,864.5938 L551,819.5938 L541,809.5938 L297,809.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M541,809.5938 L541,819.5938 L551,819.5938 L541,809.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="168.4541" x="303" y="826.6606">Si selecciona Cancelar:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.4492" x="303" y="841.7935">No se registra el rechazo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.5239" x="303" y="856.9263">y la solicitud permanece pendiente.</text></g><!--link FinalizarOpciones to RegistrarRechazo--><g class="link" data-entity-1="FinalizarOpciones" data-entity-2="RegistrarRechazo" data-link-type="dependency" data-source-line="61" data-uid="lnk9" id="link_FinalizarOpciones_RegistrarRechazo"><path d="M165.82,679.8738 C138.24,686.7038 58,706.5938 58,706.5938 C58,706.5938 50.6441,774.6184 46.7441,810.7384" fill="none" id="FinalizarOpciones-to-RegistrarRechazo" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="46.1,816.7038,51.043,808.1852,46.6367,811.7326,43.0893,807.3264,46.1,816.7038" style="stroke:#008000;stroke-width:1;"/><path d="M63,711.5938 L63,781.5938 L287,781.5938 L287,721.5938 L277,711.5938 L63,711.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M277,711.5938 L277,721.5938 L287,721.5938 L277,711.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.5576" x="69" y="728.6606">Sistema registra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.3853" x="69" y="743.7935">la dispensa como RECHAZADA,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.6826" x="69" y="758.9263">almacena motivo y fecha,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.6787" x="69" y="774.0591">y notifica al alumno.</text></g><!--link RegistrarRechazo to *end*RechazarDispensa--><g class="link" data-entity-1="RegistrarRechazo" data-entity-2=".end.RechazarDispensa" data-link-type="dependency" data-source-line="71" data-uid="lnk10" id="link_RegistrarRechazo_.end.RechazarDispensa"><path d="M39.33,857.3738 C35.96,871.2738 32,887.5938 32,887.5938 C32,887.5938 32,937.5938 32,937.5938 C32,937.5938 119.3932,955.5839 151.4532,962.1839" fill="none" id="RegistrarRechazo-to-*end*RechazarDispensa" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="157.33,963.3938,149.3214,957.6612,152.4327,962.3856,147.7083,965.4969,157.33,963.3938" style="stroke:#008000;stroke-width:1;"/><path d="M37,892.5938 L37,932.5938 L287,932.5938 L287,902.5938 L277,892.5938 L37,892.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M277,892.5938 L277,902.5938 L287,902.5938 L277,892.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.1655" x="43" y="909.6606">Sistema confirma</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.2266" x="43" y="924.7935">que la dispensa ha sido rechazada.</text></g><!--link startState to RechazarDispensa--><g class="link" data-entity-1="startState" data-entity-2="RechazarDispensa" data-link-type="dependency" data-source-line="15" data-uid="lnk2" id="link_startState_RechazarDispensa"><path d="M283.5,84.5569 C283.5,109.0069 283.5,148.6369 283.5,202.9569" fill="none" id="startState-to-RechazarDispensa" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="283.5,208.