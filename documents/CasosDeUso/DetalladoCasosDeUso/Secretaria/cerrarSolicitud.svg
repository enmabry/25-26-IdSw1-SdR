ent0006" id="entity_DecisionUsuario"><polygon fill="#F1F1F1" points="212,478.5938,224,490.5938,212,502.5938,200,490.5938,212,478.5938" style="stroke:#181818;stroke-width:0.5;"/></g><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="157" y="593.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="179.7749" y="618.4404">&#160;</text><ellipse cx="212" cy="241.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="377" cy="686.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="377" cy="686.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*cerrarSolicitud to VerificarCambios--><g class="link" data-entity-1=".start.cerrarSolicitud" data-entity-2="VerificarCambios" data-source-line="26" data-uid="lnk4" id="link_.start.cerrarSolicitud_VerificarCambios"><path d="M212,251.9237 C212,270.5338 212,306.6138 212,331.3738" fill="none" id="*start*cerrarSolicitud-to-VerificarCambios" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="212,337.3738,216,328.3738,212,332.3738,208,328.3738,212,337.3738" style="stroke:#008000;stroke-width:1;"/><path d="M217,274.5938 L217,314.5938 L518,314.5938 L518,284.5938 L508,274.5938 L217,274.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M508,274.5938 L508,284.5938 L518,284.5938 L508,274.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="280.1855" x="223" y="291.6606">Sistema verifica si hay modificaciones</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.4707" x="223" y="306.7935">pendientes de guardar.</text></g><!--link VerificarCambios to DecisionUsuario--><g class="link" data-entity-1="VerificarCambios" data-entity-2="DecisionUsuario" data-source-line="33" data-uid="lnk5" id="link_VerificarCambios_DecisionUsuario"><path d="M212,377.6438 C212,405.3138 212,449.7838 212,472.2637" fill="none" id="VerificarCambios-to-DecisionUsuario" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="212,478.2637,216,469.2637,212,473.2637,208,469.2637,212,478.2637" style="stroke:#008000;stroke-width:1;"/><path d="M217,400.5938 L217,455.5938 L509,455.5938 L509,410.5938 L499,400.5938 L217,400.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M499,400.5938 L499,410.5938 L509,410.5938 L499,400.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="271.4321" x="223" y="417.6606">Si hay cambios, el sistema pregunta:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.1509" x="223" y="432.7935">&#191;Desea guardar o descartar?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.3184" x="223" y="447.9263">Si no hay cambios, avanza directamente.</text></g><!--link DecisionUsuario to *end*cerrarSolicitud--><g class="link" data-entity-1="DecisionUsuario" data-entity-2=".end.cerrarSolicitud" data-source-line="41" data-uid="lnk7" id="link_DecisionUsuario_.end.cerrarSolicitud"><path d="M221.79,493.1538 C259.59,499.1738 394,520.5938 394,520.5938 C394,520.5938 394,570.5938 394,570.5938 C394,570.5938 383.5475,641.3083 379.3875,669.4483" fill="none" id="DecisionUsuario-to-*end*cerrarSolicitud" style="stroke:#FF0000;stroke-width:1;"/><polygon fill="#FF0000" points="378.51,675.3838,383.7832,667.0655,379.2412,670.4375,375.8692,665.8955,378.51,675.3838" style="stroke:#FF0000;stroke-width:1;"/><path d="M396,593.5938 L396,633.5938 L780,633.5938 L780,603.5938 L770,593.5938 L396,593.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M770,593.5938 L770,603.5938 L780,603.5938 L770,593.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="221.1143" x="402" y="610.6606">Si el usuario cancela el cierre:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.1558" x="402" y="625.7935">El caso de uso aborta, manteniendo la solicitud abierta.</text></g><!--link DecisionUsuario to MostrarListado--><g class="link" data-entity-1="DecisionUsuario" data-entity-2="MostrarListado" data-source-line="48" data-uid="lnk8" id="link_DecisionUsuario_MostrarListado"><path d="M202.38,493.0338 C163.23,498.8837 18,520.5938 18,520.5938 C18,520.5938 18,570.5938 18,570.5938 C18,570.5938 104.9176,592.8553 150.9176,604.6353" fill="none" id="DecisionUsuario-to-MostrarListado" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="156.73,606.1238,149.0037,600.0161,151.8863,604.8833,147.019,607.766,156.73,606.1238" style="stroke:#008000;stroke-width:1;"/><path d="M23,525.5938 L23,565.5938 L389,565.5938 L389,535.5938 L379,525.5938 L23,525.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><path d="M379,525.5938 L379,535.5938 L389,535.5938 L379,525.5938" fill="#F5F5F5" style="stroke:#008000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="345.4902" x="29" y="542.6606">Sistema descarta cambios (si no se guardaron)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.0601" x="29" y="557.7935">y presenta la interfaz de listado de dispensas.</text></g><!--link MostrarListado to *end*cerrarSolicitud--><g class="link" data-entity-1="MostrarListado" data-entity-2=".end.cerrarSolicitud" data-source-line="56" data-uid="lnk9" id="link_MostrarListado_.end.cerrarSolicitud"><path d="M207