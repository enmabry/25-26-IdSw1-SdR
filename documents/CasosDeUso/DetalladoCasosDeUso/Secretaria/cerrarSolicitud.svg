.1738 394,540.5938 394,540.5938 C394,540.5938 394,590.5938 394,590.5938 C394,590.5938 383.5475,661.3083 379.3875,689.4483" fill="none" id="DecisionUsuario-to-*end*cerrarSolicitud" style="stroke:#FF0000;stroke-width:1;"/><polygon fill="#FF0000" points="378.51,695.3838,383.7832,687.0655,379.2412,690.4375,375.8692,685.8955,378.51,695.3838" style="stroke:#FF0000;stroke-width:1;"/><path d="M396,613.5938 L396,653.5938 L780,653.5938 L780,623.5938 L770,613.5938 L396,613.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M770,613.5938 L770,623.5938 L780,623.5938 L770,613.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="221.1143" x="402" y="630.6606">Si el usuario cancela el cierre:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.1558" x="402" y="645.7935">El caso de uso aborta, manteniendo la solicitud abierta.</text></g><!--link DecisionUsuario to MostrarListado--><g class="link" data-entity-1="DecisionUsuario" data-entity-2="MostrarListado" data-source-line="41" data-uid="lnk8" id="link_DecisionUsuario_MostrarListado"><path d="M202.38,513.0338 C163.23,518.8838 18,540.5938 18,540.5938 C18,540.5938 18,590.5938 18,590.5938 C18,590.5938 104.9176,612.8553 150.9176,624.6353" fill="none" id="DecisionUsuario-to-MostrarListado" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="156.73,626.1238,149.0037,620.0161,151.8863,624.8833,147.019,627.766,156.73,626.1238" style="stroke:#008000;stroke-width:1;"/><path d="M23,545.5938 L23,585.5938 L389,585.5938 L389,555.5938 L379,545.5938 L23,545.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M379,545.5938 L379,555.5938 L389,555.5938 L379,545.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="345.4902" x="29" y="562.6606">Sistema descarta cambios (si no se guardaron)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.0601" x="29" y="577.7935">y presenta la interfaz de listado de dispensas.</text></g><!--link MostrarListado to *end*cerrarSolicitud--><g class="link" data-entity-1="MostrarListado" data-entity-2=".end.cerrarSolicitud" data-source-line="49" data-uid="lnk9" id="link_MostrarListado_.end.cerrarSolicitud"><path d="M207.09,643.7338 C250.3,659.4638 331.312,688.9613 361.062,699.7913" fill="none" id="MostrarListado-to-*end*cerrarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="366.7,701.8438,359.6112,695.0064,362.0016,700.1334,356.8746,702.5238,366.7,701.8438" style="stroke:#008000;stroke-width:1;"/></g><!--link startState to cerrarSolicitud--><g class="link" data-entity-1="startState" data-entity-2="cerrarSolicitud" data-source-line="8" data-uid="lnk2" id="link_startState_cerrarSolicitud"><path d="M398,94.3769 C398,118.6369 398,152.8669 398,198.0669" fill="none" id="startState-to-cerrarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="398,204.0669,402,195.0669,398,199.0669,394,195.0669,398,204.0669" style="stroke:#008000;stroke-width:1;"/><path d="M403,129.2969 L403,169.2969 L537,169.2969 L537,139.2969 L527,129.2969 L403,129.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M527,129.2969 L527,139.2969 L537,139.2969 L527,129.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.3755" x="409" y="146.3638">Usuario solicita</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.9849" x="409" y="161.4966">Cerrar Solicitud</text></g><!--link cerrarSolicitud to endState--><g class="link" data-entity-1="cerrarSolicitu