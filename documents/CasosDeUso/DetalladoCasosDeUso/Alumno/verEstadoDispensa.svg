000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.856" x="55" y="598.9263">desde donde el Alumno podr&#225;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.8667" x="55" y="614.0591">&#8226; cerrarSolicitud()</text></g><!--link DISPENSAS_ABIERTO_INICIAL to verEstadoDispensa--><g class="link" data-entity-1="DISPENSAS_ABIERTO_INICIAL" data-entity-2="verEstadoDispensa" data-link-type="dependency" data-source-line="7" data-uid="lnk2" id="link_DISPENSAS_ABIERTO_INICIAL_verEstadoDispensa"><path d="M234.5,94.7769 C234.5,109.5969 234.5,124.1869 234.5,147.8369" fill="none" id="DISPENSAS_ABIERTO_INICIAL-to-verEstadoDispensa" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="234.5,153.8369,238.5,144.8369,234.5,148.8369,230.5,144.8369,234.5,153.8369" style="stroke:#008000;stroke-width:1;"/></g><!--link verEstadoDispensa to SOLICITUD_DISPENSA_ABIERTA_FINAL--><g class="link" data-entity-1="verEstadoDispensa" data-entity-2="SOLICITUD_DISPENSA_ABIERTA_FINAL" data-link-type="dependency" data-source-line="38" data-uid="lnk8" id="link_verEstadoDispensa_SOLICITUD_DISPENSA_ABIERTA_FINAL"><path d="M234.5,676.8469 C234.5,700.5869 234.5,715.2469 234.5,730.1069" fill="none" id="verEstadoDispensa-to-SOLICITUD_DISPENSA_ABIERTA_FINAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="234.5,736.1069,238.5,727.1069,234.5,731.1069,230.5,727.1069,234.5,736.1069" style="stroke:#008000;stroke-width:1;"/></g><!--SRC=[ZLDRQjmm5FtNAYxkJrBo-0-3mUrCmP1CIfts9uH1aM-BY2mPFKA7KkXMqYrq2REJhYHNiZs9uvZM_Z2MphawvnvTBxr2-88Mq7bU6wWHQkbQr8upToTroorlG4cDVjiYj4PjumzZ1FS8oxBwk5fNHRKftfMhJrUNct9TlY-BS-0EiibkrjEgotD2NNrURWP8ZoWs7yfrpvu7POpD7tny_UQRHTGtnpdSerqbNyl1KozWif5EdAmU76RmWp6Wf-Dbz1AoGeL2IAChewIGFjHJJ5VfmZXlwTiLkNvxCz8tKqSRAcDqRFjTMbZSveKAZJQBqziyHhLx0DJJxYVmlKHDIQ8Y_ZxKHSXTS8lJa8CRpaANy5lQ5v8mmcWNbESsSf_kGz0yVb0fxauIW-edZPsfgOcHnnTz-0z_RYZ8qzbxlL6WiEZv2HjO5Jd4XYUQHH5Qj1mK1wc_6j