="bold" lengthAdjust="spacing" textLength="55.5039" x="55" y="251.6606">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.1729" x="114.6362" y="251.6606">est&#225; en DISPENSAS_ABIERTO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.2705" x="55" y="266.7935">viendo el listado de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" text-decoration="underline" textLength="21.7852" x="186.4028" y="266.7935">sus</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="69.0688" x="212.3203" y="266.7935">solicitudes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.0718" x="55" y="281.9263">y decide consultar el estado de una de ellas.</text></g><!--link SeleccionSolicitud to EstadoMostrado--><g class="link" data-entity-1="SeleccionSolicitud" data-entity-2="EstadoMostrado" data-link-type="dependency" data-source-line="21" data-uid="lnk5" id="link_SeleccionSolicitud_EstadoMostrado"><path d="M44,362.7938 C44,393.8038 44,441.2438 44,472.2938" fill="none" id="SeleccionSolicitud-to-EstadoMostrado" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,478.2938,48,469.2938,44,473.2938,40,469.2938,44,478.2938" style="stroke:#008000;stroke-width:1;"/><path d="M49,385.5938 L49,455.5938 L350,455.5938 L350,395.5938 L340,385.5938 L49,385.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M340,385.5938 L340,395.5938 L350,395.5938 L340,385.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="55" y="402.6606">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.6128" x="114.6362" y="402.6606">selecc