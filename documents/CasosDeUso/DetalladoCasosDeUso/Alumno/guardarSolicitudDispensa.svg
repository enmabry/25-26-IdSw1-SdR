<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="822px" preserveAspectRatio="none" style="width:464px;height:822px;background:#FFFFFF;" version="1.1" viewBox="0 0 464 822" width="464px" zoomAndPan="magnify"><title>Guardar solicitud de dispensa</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="236.0654" x="103.9673" y="22.9951">Guardar solicitud de dispensa</text></g><g id="SOLICITUD_DISPENSA_ABIERTA_INICIAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.3516" x="109.32" y="44.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="109.32" x2="348.6716" y1="70.5938" y2="70.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3516" x="119.32" y="62.292">SOLICITUD_DISPENSA_ABIERTA</text></g><g id="DISPENSAS_ABIERTO_FINAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="167.3623" x="145.32" y="766.5969"/><line style="stroke:#181818;stroke-width:0.5;" x1="145.32" x2="312.6823" y1="792.8938" y2="792.8938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.3623" x="155.32" y="784.592">DISPENSAS_ABIERTO</text></g><path d="M19.5,154.2969 L438.5,154.2969 A12.5,12.5 0 0 1 451,166.7969 L451,180.5938 L7,180.5938 L7,166.7969 A12.5,12.5 0 0 1 19.5,154.2969" fill="#F1F1F1"/><rect fill="none" height="552.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="444" x="7" y="154.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="451" y1="180.5938" y2="180.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.3076" x="165.8462" y="172.292">guardarSolicitud()</text><g id="guardarSolicitud.Paso1"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="312.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="338.8906" y2="338.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="330.5889">&#160;</text></g><g id="guardarSolicitud.Paso2"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="523.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="549.8906" y2="549.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="541.5889">&#160;</text></g><ellipse cx="44" cy="201.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="685.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="685.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*guardarSolicitud to Paso1--><g class="link" data-entity-1=".start.guardarSolicitud" data-entity-2="Paso1" data-link-type="dependency" data-source-line="14" data-uid="lnk4" id="link_.start.guardarSolicitud_Paso1"><path d="M44,211.8037 C44,232.2638 44,276.0638 44,306.1938" fill="none" id="*start*guardarSolicitud-to-Paso1" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,312.1938,48,303.1938,44,307.1938,40,303.1938,44,312.1938" style="stroke:#008000;stroke-width:1;"/><path d="M49,234.5938 L49,289.5938 L442,289.5938 L442,244.5938 L432,234.5938 L49,234.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M432,234.5938 L432,244.5938 L442,244.5938 L432,234.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="55" y="251.6606">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.3584" x="114.6362" y="251.6606">se encuentra en SOLICITUD_DISPENSA_ABIERTA</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.5444" x="55" y="266.7935">tras crear o editar la solicitud y pulsa la opci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.7085" x="55" y="281.9263">"Guardar solicitud".</text></g><!--link Paso1 to Paso2--><g class="link" data-entity-1="Paso1" data-entity-2="Paso2" data-link-type="dependency" data-source-line="21" data-uid="lnk5" id="link_Paso1_Paso2"><path d="M44,362.9738 C44,403.2538 44,477.1938 44,517.3638" fill="none" id="Paso1-to-Paso2" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,523.3638,48,514.3638,44,518.3638,40,514.3638,44,523.3638" style="stroke:#008000;stroke-width:1;"/><path d="M49,385.5938 L49,500.5938 L388,500.5938 L388,395.5938 L378,385.5938 L49,385.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M378,385.5938 L378,395.5938 L388,395.5938 L378,385.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="402.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.2012" x="118.0386" y="402.6606">valida los datos actuales de la solicitud</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.7969" x="55" y="417.7935">(motivo, periodo, documentaci&#243;n adjunta, etc.).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="55" y="432.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.1753" x="55" y="448.0591">Si la validaci&#243;n es correcta:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.377" x="55" y="463.1919">&#8226; persiste los cambios en la base de datos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.2813" x="55" y="478.3247">&#8226; mantiene el estado l&#243;gico de la dispensa</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.7412" x="63.2646" y="493.4575">(por ejemplo, "Solicitada").</text></g><!--link Paso2 to *end*guardarSolicitud--><g class="link" data-entity-1="Paso2" data-entity-2=".end.guardarSolicitud" data-link-type="dependency" data-source-line="32" data-uid="lnk7" id="link_Paso2_.end.guardarSolicitud"><path d="M44,574.0438 C44,603.8238 44,646.8038 44,668.1338" fill="none" id="Paso2-to-*end*guardarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,674.1338,48,665.1338,44,669.1338,40,665.1338,44,674.1338" style="stroke:#008000;stroke-width:1;"/><path d="M49,596.5938 L49,651.5938 L392,651.5938 L392,606.5938 L382,596.5938 L49,596.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M382,596.5938 L382,606.5938 L392,606.5938 L382,596.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="613.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.0454" x="118.0386" y="613.6606">muestra un mensaje de confirmaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.0283" x="55" y="628.7935">y cierra el detalle, volviendo al listado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.4229" x="55" y="643.9263">de solicitudes del Alumno (DISPENSAS_ABIERTO).</text></g><!--link SOLICITUD_DISPENSA_ABIERTA_INICIAL to guardarSolicitud--><g class="link" data-entity-1="SOLICITUD_DISPENSA_ABIERTA_INICIAL" data-entity-2="guardarSolicitud" data-link-type="dependency" data-source-line="7" data-uid="lnk2" id="link_SOLICITUD_DISPENSA_ABIERTA_INICIAL_guardarSolicitud"><path d="M229,94.7069 C229,109.5469 229,124.2169 229,148.0869" fill="none" id="SOLICITUD_DISPENSA_ABIERTA_INICIAL-to-guardarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="229,154.0869,233,145.0869,229,149.0869,225,145.0869,229,154.0869" style="stroke:#008000;stroke-width:1;"/></g><!--link guardarSolicitud to DISPENSAS_ABIERTO_FINAL--><g class="link" data-entity-1="guardarSolicitud" data-entity-2="DISPENSAS_ABIERTO_FINAL" data-link-type="dependency" data-source-line="40" data-uid="lnk8" id="link_guardarSolicitud_DISPENSAS_ABIERTO_FINAL"><path d="M229,706.8469 C229,730.6969 229,745.3569 229,760.1869" fill="none" id="guardarSolicitud-to-DISPENSAS_ABIERTO_FINAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="229,766.1869,233,757.1869,229,761.1869,225,757.1869,229,766.1869" style="stroke:#008000;stroke-width:1;"/></g><!--SRC=[ZLDTQXin47xVKmpR5xiuBlLZ2GQtISj2S48tVGh1ZAMfaQEVHT8QJ2dqBBr2Zf2Rz2GTQMt7iUkIDQore_bclcz-eegQu4kBNgA7uBGIAhOI985KeI4Ri0WFoZReqO1MbkAw8MYSNgUFeWWH8q5zVLLzgcw_NSmkglhcSbfFPfEFrUNNsyciclBDv0emG7dQhTm4sjhhpSNrx7CrPVJUam8TkPL5yGeEPtTl5fx8tf-DOT5fhhUIjr8ExJdVeR7NB-57KIGw7Qha7plUO73l_sqUTUvtR-zVq7X6MCS0PrEH7xBXV3wUwDPOT_vkFeP0G5QqPAD7Flsdv1dCNW649-wg0v8gya7ZNeVNqBGwO3AwHgYdHvjnvT4ibCDyGLPcYfsCJFj8oEYaa5g5I0QpaXLg9Jcn2o0nyXj5R55JI5Etpp63UyP5jN83QCWh9_aWdMWDrm4pQq2vRFbZ01J5i3_i-DKgHUeoTMuSNZZlIKJya5t-_FgTOeR4B9CHQEQA_xcuZ9qZLpojGQAu0nYqKP7bNcYE654wq4-F2oNSXlnkQxfXxJNE0ot9D9gPbvi1Gebb_rHPHo_AolFoggAQbkdmPBGMJCg_pEI5iz-LD_ZStpK8HJwDa6Q7Y5hJ05PEhrWLYq7D6RAkxCqXTjt8_T7GZIJqZbRmKD3FeZZQfNrb9rRzBm00]--></g></svg>