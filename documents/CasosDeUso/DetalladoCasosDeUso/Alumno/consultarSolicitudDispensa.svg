<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="855px" preserveAspectRatio="none" style="width:1403px;height:855px;background:#FFFFFF;" version="1.1" viewBox="0 0 1403 855" width="1403px" zoomAndPan="magnify"><title>Consultar solicitud de dispensa</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="247.8848" x="570.5576" y="22.9951">Consultar solicitud de dispensa</text></g><g><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="167.3623" x="442.32" y="124.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="442.32" x2="609.6823" y1="150.5938" y2="150.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.3623" x="452.32" y="142.292">DISPENSAS_ABIERTO</text></g><path d="M264.35,361.2969 L787.65,361.2969 A12.5,12.5 0 0 1 800.15,373.7969 L800.15,387.5937 L251.85,387.5937 L251.85,373.7969 A12.5,12.5 0 0 1 264.35,361.2969" fill="#F1F1F1"/><rect fill="none" height="488.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="548.3" x="251.85" y="361.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="251.85" x2="800.15" y1="387.5937" y2="387.5937"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3516" x="416.3242" y="379.292">SOLICITUD_DISPENSA_ABIERTA</text><g><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="188.6084" x="263.85" y="579.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="263.85" x2="452.4584" y1="605.8906" y2="605.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.6084" x="273.85" y="597.5889">ConsultarEditarSolicitud</text></g><g><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="115.8125" x="300.25" y="730.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="300.25" x2="416.0625" y1="756.8906" y2="756.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.8125" x="310.25" y="748.5889">DecidirAccion</text></g><ellipse cx="358.15" cy="408.5937" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="358.15" cy="828.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="358.15" cy="828.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*SOLICITUD_DISPENSA_ABIERTA_COMP to ConsultarEditarSolicitud--><g class="link" data-entity-1="ent0005" data-entity-2="ent0004" data-link-type="dependency" data-source-line="26" id="lnk6"><path d="M358.15,418.9537 C358.15,447.7837 358.15,529.9537 358.15,573.1837" fill="none" id="*start*SOLICITUD_DISPENSA_ABIERTA_COMP-to-ConsultarEditarSolicitud" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="358.15,579.1837,362.15,570.1837,358.15,574.1837,354.15,570.1837,358.15,579.1837" style="stroke:#008000;stroke-width:1;"/><path d="M363.15,441.5937 L363.15,556.5938 L791.15,556.5938 L791.15,451.5937 L781.15,441.5937 L363.15,441.5937" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M781.15,441.5937 L781.15,451.5937 L791.15,451.5937 L781.15,441.5937" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="369.15" y="458.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.5889" x="432.1886" y="458.6606">muestra todos los datos de la solicitud seleccionada:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.2041" x="369.15" y="473.7935">&#8226; Estado (aprobada, rechazada, pendiente)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.4839" x="369.15" y="488.9263">&#8226; Comentarios del Director / Secretar&#237;a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.2222" x="369.15" y="504.0591">&#8226; Datos de asignatura, motivo, documentaci&#243;n, etc.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="369.15" y="519.1919">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="369.15" y="534.3247">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.4336" x="428.7862" y="534.3247">puede simplemente consultar la informaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.771" x="369.15" y="549.4575">o modificar los datos permitidos (editarSolicitudDispensa()).</text></g><!--link ConsultarEditarSolicitud to DecidirAccion--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="37" id="lnk7"><path d="M358.15,629.8638 C358.15,657.5738 358.15,696.6338 358.15,724.3338" fill="none" id="ConsultarEditarSolicitud-to-DecidirAccion" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="358.15,730.3338,362.15,721.3338,358.15,725.3338,354.15,721.3338,358.15,730.3338" style="stroke:#008000;stroke-width:1;"/><path d="M363.15,652.5938 L363.15,707.5938 L749.15,707.5938 L749.15,662.5938 L739.15,652.5938 L363.15,652.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M739.15,652.5938 L739.15,662.5938 L749.15,662.5938 L739.15,652.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.7686" x="369.15" y="669.6606">Al finalizar, el Alumno decide:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.9277" x="369.15" y="684.7935">&#8226; guardarSolicitudDispensa(), o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.8281" x="369.15" y="699.9263">&#8226; cerrarSolicitudDispensa() (salir descartando cambios).</text></g><!--link DecidirAccion to *end*SOLICITUD_DISPENSA_ABIERTA_COMP--><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" data-link-type="dependency" data-source-line="44" id="lnk9"><path d="M358.15,781.0238 C358.15,793.3838 358.15,801.7237 358.15,811.1937" fill="none" id="DecidirAccion-to-*end*SOLICITUD_DISPENSA_ABIERTA_COMP" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="358.15,817.1937,362.15,808.1937,358.15,812.1937,354.15,808.1937,358.15,817.1937" style="stroke:#008000;stroke-width:1;"/></g><ellipse cx="526" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to DISPENSAS_ABIERTO_INICIAL--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="7" id="lnk3"><path d="M526,63.6569 C526,77.5869 526,98.2569 526,117.9469" fill="none" id="*start*-to-DISPENSAS_ABIERTO_INICIAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="526,123.9469,530,114.9469,526,118.9469,522,114.9469,526,123.9469" style="stroke:#008000;stroke-width:1;"/></g><!--link DISPENSAS_ABIERTO_INICIAL to SOLICITUD_DISPENSA_ABIERTA_COMP--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="10" id="lnk4"><path d="M441.88,159.0369 C294.7,174.3169 6,204.2969 6,204.2969 C6,204.2969 6,331.2969 6,331.2969 C6,331.2969 121.2182,391.8267 246.2182,457.4867" fill="none" id="DISPENSAS_ABIERTO_INICIAL-to-SOLICITUD_DISPENSA_ABIERTA_COMP" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="251.53,460.2769,245.4225,452.5504,247.1035,457.9517,241.7022,459.6328,251.53,460.2769" style="stroke:#008000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.9165" x="151.8523" y="217.3638">consultarSolicitudDispensa()</text><path d="M11,226.4297 L11,326.4297 L478,326.4297 L478,236.4297 L468,226.4297 L11,226.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M468,226.4297 L468,236.4297 L478,236.4297 L468,226.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="17" y="243.4966">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.5112" x="76.6362" y="243.4966">se encuentra en DISPENSAS_ABIERTO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.6211" x="17" y="258.6294">(listado de sus solicitudes) y selecciona una solicitud para consultar.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="17" y="273.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="17" y="288.895">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.5596" x="80.0386" y="288.895">muestra su estado actual</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.6143" x="17" y="304.0278">(aprobada / rechazada / pendiente) y comentarios,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="406.6563" x="17" y="319.1606">y abre la solicitud en detalle (SOLICITUD_DISPENSA_ABIERTA).</text></g><!--link SOLICITUD_DISPENSA_ABIERTA_COMP to DISPENSAS_ABIERTO_INICIAL--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="dependency" data-source-line="48" id="lnk10"><path d="M523.33,361.0469 C523.13,342.7869 523,331.2969 523,331.2969 C523,331.2969 523,204.2969 523,204.2969 C523,204.2969 523.5186,195.0477 524.3086,180.7677" fill="none" id="SOLICITUD_DISPENSA_ABIERTA_COMP-to-DISPENSAS_ABIERTO_INICIAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="524.64,174.7769,520.149,183.5422,524.3638,179.7692,528.1368,183.9841,524.64,174.7769" style="stroke:#008000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.9092" x="624.3298" y="247.3638">guardarSolicitudDispensa()</text><path d="M528,256.4297 L528,296.4297 L897,296.4297 L897,266.4297 L887,256.4297 L528,256.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M887,256.4297 L887,266.4297 L897,266.4297 L887,256.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="534" y="273.4966">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.5142" x="597.0386" y="273.4966">guarda los cambios de la solicitud</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.5688" x="534" y="288.6294">y vuelve a DISPENSAS_ABIERTO (listado actualizado).</text></g><!--link SOLICITUD_DISPENSA_ABIERTA_COMP to DISPENSAS_ABIERTO_INICIAL--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="dependency" data-source-line="54" id="lnk11"><path d="M800.4,407.2069 C860.2,364.2169 906,331.2969 906,331.2969 C906,331.2969 906,204.2969 906,204.2969 C906,204.2969 727.7103,178.9609 615.8003,163.0609" fill="none" id="SOLICITUD_DISPENSA_ABIERTA_COMP-to-DISPENSAS_ABIERTO_INICIAL-1" style="stroke:#FF0000;stroke-width:1;"/><polygon fill="#FF0000" points="609.86,162.2169,618.2079,167.4431,614.8103,162.9202,619.3332,159.5226,609.86,162.2169" style="stroke:#FF0000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.6899" x="1071.5681" y="247.3638">cerrarSolicitudDispensa()</text><path d="M911,256.4297 L911,296.4297 L1396,296.4297 L1396,266.4297 L1386,256.4297 L911,256.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1386,256.4297 L1386,266.4297 L1396,266.4297 L1386,256.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="917" y="273.4966">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.9492" x="980.0386" y="273.4966">descarta los cambios realizados</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="464.8262" x="917" y="288.6294">y vuelve a DISPENSAS_ABIERTO manteniendo la solicitud como estaba.</text></g><!--SRC=[ZLHDJnin4BtxLupeeQ4AS4S8AKroY4G1DMql24KJUqWjlFRAzgA6gb9_I-yzzTOh_wI_fEFTP3z8GbWfgztiyyoyzsOcwcW8Xiw6maJq49pHKiT2WI9GEkHa0ufmhssE7ZCmsb9SvWIvCylq8aI860b6a-dr-78wcCu6xoVZZv-kPfFBoN0ok83wmW076x23rVdfrGN3FtqUpTQG5M8m6rvzk5wVtmqx4EBctIqStRnPU29xUtI-koOXtiA80bCamvIu0kNQX4C_VK1JPDQ1N8a3XKMWRumc6qdi9jmkOH-jqpgydwwb7wsgw1qAwrWQPvFiz-9iVZueIpexcPz3uEAjBBWMpsNPJRAYrs8MYj1uI-4GbXp0a9JQsOfPutnokYdhMAJ4qqGxmp9pLb18IKC1L2L06GiqeeUvTtDK22VWINx5n-gPsIYTH4jffSlu4RrseI-MW7DFODhfcOkYY8RxihTRliDZmL4X2PJS7BeiTpvYbl8uq9pCsv9v9pREDJ7gbJstf-7Wkn2fBwjWzGoDbMwxsOACI6gb_Q1KlJhxl6LVZDBfXlJ73cEYKow0uP_2cExFL6YSLtXQ1lhtynUCAozh4_kDX_sMXJL-s1Z96GoCDEEZyspubAHd2_tJRwpXetKf6FJ2OYmyXyrSr0-k3yh9eemczTCVozCNvR5OKsmrVLvGQcQTvOOIdfe-JHIrlNC-guAKfnrdKFfEo_IzrYCdd-ceaqWzwkhSp1utM8hGD