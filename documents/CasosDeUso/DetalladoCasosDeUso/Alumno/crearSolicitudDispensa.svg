n estado editable (SOLICITUD_DISPENSA_ABIERTA).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="239.05" y="549.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="239.05" y="565.0591">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.6323" x="298.6862" y="565.0591">puede completar o modificar:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.4165" x="239.05" y="580.1919">&#8226; Motivo de la dispensa</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.5718" x="239.05" y="595.3247">&#8226; Documentaci&#243;n adjunta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.0146" x="239.05" y="610.4575">&#8226; Otros datos opcionales</text></g><!--link FormularioEdicion to DecidirAccion--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="41" id="lnk7"><path d="M228.05,690.8638 C228.05,718.5738 228.05,757.6338 228.05,785.3338" fill="none" id="FormularioEdicion-to-DecidirAccion" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="228.05,791.3338,232.05,782.3338,228.05,786.3338,224.05,782.3338,228.05,791.3338" style="stroke:#008000;stroke-width:1;"/><path d="M233.05,713.5938 L233.05,768.5938 L584.05,768.5938 L584.05,723.5938 L574.05,713.5938 L233.05,713.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M574.05,713.5938 L574.05,723.5938 L584.05,723.5938 L574.05,713.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.2817" x="239.05" y="730.6606">Al terminar, el Alumno decide:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.9277" x="239.05" y="745.7935">&#8226; guardarSolicitudDispensa(), o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.9287" x="239.05" y="760.9263">&#8226; cerrarSolicitudDispensa() (descartar la solicitud).</text></g><!--link DecidirAccion to *end*SOLICITUD_DISPENSA_ABIERTA_INICIAL--><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" data-link-type="dependency" data-source-line="48" id="lnk9"><path d="M228.05,842.0238 C228.05,854.3838 228.05,862.7237 228.05,872.1937" fill="none" id="DecidirAccion-to-*end*SOLICITUD_DISPENSA_ABIERTA_INICIAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="228.05,878.1937,232.05,869.1937,228.05,873.1937,224.05,869.1937,228.05,878.1937" style="stroke:#008000;stroke-width:1;"/></g><ellipse cx="386" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to DISPENSAS_ABIERTO_INICIAL--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="7" id="lnk3"><path d="M386,63.6569 C386,77.5869 386,98.2569 386,117.9469" fill="none" id="*start*-to-DISPENSAS_ABIERTO_INICIAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="386,123.9469,390,114.9469,386,118.9469,382,114.9469,386,123.9469" style="stroke:#008000;stroke-width:1;"/></g><!--link DISPENSAS_ABIERTO_INICIAL to SOLICITUD_DISPENSA_ABIERTA_INICIAL--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="10" id="lnk4"><path d="M302.14,162.2169 C190.23,178.1169 6,204.2969 6,204.2969 C6,204.2969 6,392.2969 6,392.2969 C6,392.2969 63.5379,433.6651 137.7779,487.0251" fill="none" id="DISPENSAS_ABIERTO_INICIAL-to-SOLICITUD_DISPENSA_ABIERTA_INICIAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="142.65,490.5269,137.6764,482.0261,138.5899,487.6087,133.0073,488.5222,142.65,490.5269" style="stroke:#008000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.3452" x="94.9011" y="217.3638">crearSolicitudDispensa()</text><path d="M11,226.4297 L11,387.4297 L338,387.4297 L338,236.4297 L328,226.4297 L11,226.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M328,226.4297 L328,236.4297 L338,236.4297 L328,226.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="17" y="243.4966">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.5112" x="76.6362" y="243.4966">se encuentra en DISPENSAS_ABIERTO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.3149" x="17" y="258.6294">(listado de sus solicitudes) y selecciona</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.0444" x="17" y="273.7622">"Crear nueva solicitud de dispensa()".</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="17" y="288.895">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="17" y="304.0278">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.4468" x="80.0386" y="304.0278">solicita los datos m&#237;nimos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.1934" x="17" y="319.1606">&#8226; Asignatura / periodo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.7505" x="17" y="334.2935">&#8226; Horario</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="17" y="349.4263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.0391" x="17" y="364.5591">Tras confirmar, se crea la nueva solicitud</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.7334" x="17" y="379.6919">y se pasa a SOLICITUD_DISPENSA_ABIERTA.</text></g><!--link SOLICITUD_DISPENSA_ABIERTA_INICIAL to DISPENSAS_ABIERTO_INICIAL--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="dependency" data-source-line="52" id="lnk10"><path d="M383.33,422.0469 C383.13,403.7869 383,392.2969 383,392.2969 C383,392.2969 383,204.2969 383,204.2969 C383,204.2969 383.5186,195.0477 384.3086,180.7677" fill="none" id="SOLICITUD_DISPENSA_ABIERTA_INICIAL-to-DISPENSAS_ABIERTO_INICIAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="384.64,174.7769,380.149,183.5422,384.3638,179.7692,388.1368,183.9841,384.64,174.7769" style="stroke:#008000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.9092" x="484.3298" y="277.8638">guardarSolicitudDispensa()</text><path d="M388,286.9297 L388,326.9297 L757,326.9297 L757,296.9297 L747,286.9297 L388,286.9297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M747,286.9297 L747,296.9297 L757,296.9297 L747,286.9297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="394" y="303.9966">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.8096" x="457.0386" y="303.9966">guarda la nueva solicitud de dispensa</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.5688" x="394" y="31