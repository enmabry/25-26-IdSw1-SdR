<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="901px" preserveAspectRatio="none" style="width:1983px;height:901px;background:#FFFFFF;" version="1.1" viewBox="0 0 1983 901" width="1983px" zoomAndPan="magnify"><title>Editar solicitud de dispensa</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="219.3105" x="874.8447" y="22.9951">Editar solicitud de dispensa</text></g><g><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="167.3623" x="668.32" y="124.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="668.32" x2="835.6823" y1="150.5938" y2="150.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.3623" x="678.32" y="142.292">DISPENSAS_ABIERTO</text></g><path d="M472.55,361.2969 L1031.46,361.2969 A12.5,12.5 0 0 1 1043.96,373.7969 L1043.96,387.5938 L460.05,387.5938 L460.05,373.7969 A12.5,12.5 0 0 1 472.55,361.2969" fill="#F1F1F1"/><rect fill="none" height="534.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="583.91" x="460.05" y="361.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="460.05" x2="1043.96" y1="387.5938" y2="387.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3516" x="642.3292" y="379.292">SOLICITUD_DISPENSA_ABIERTA</text><g><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="103.5283" x="478.19" y="625.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="478.19" x2="581.7183" y1="651.8906" y2="651.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.5283" x="488.19" y="643.5889">PasoEdicion</text></g><g><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="115.8125" x="472.05" y="776.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="472.05" x2="587.8625" y1="802.8906" y2="802.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.8125" x="482.05" y="794.5889">DecidirAccion</text></g><ellipse cx="529.96" cy="408.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="529.96" cy="874.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="529.96" cy="874.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*SOLICITUD_DISPENSA_ABIERTA to PasoEdicion--><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" data-link-type="dependency" data-source-line="38" id="lnk7"><path d="M529.96,419.0038 C529.96,453.4038 529.96,567.0938 529.96,619.1238" fill="none" id="*start*SOLICITUD_DISPENSA_ABIERTA-to-PasoEdicion" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="529.96,625.1238,533.96,616.1238,529.96,620.1238,525.96,616.1238,529.96,625.1238" style="stroke:#008000;stroke-width:1;"/><path d="M534.96,441.5938 L534.96,602.5938 L1034.96,602.5938 L1034.96,451.5938 L1024.96,441.5938 L534.96,441.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1024.96,441.5938 L1024.96,451.5938 L1034.96,451.5938 L1024.96,441.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="540.96" y="458.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.7456" x="603.9986" y="458.6606">muestra el formulario de la solicitud</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.0493" x="540.96" y="473.7935">con los datos actuales.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="540.96" y="488.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="540.96" y="504.0591">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="45.1191" x="600.5962" y="504.0591">puede:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="443.8789" x="540.96" y="519.1919">&#8226; completar datos faltantes (si viene de crearSolicitudDispensa()), o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="479.0259" x="540.96" y="534.3247">&#8226; modificar/a&#241;adir informaci&#243;n (si viene de consultarSolicitudDispensa()),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.4956" x="549.2246" y="549.4575">por ejemplo para apelar una dispensa rechazada:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.3452" x="549.2246" y="564.5903">- ampliar motivo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.4497" x="549.2246" y="579.7231">- adjuntar nueva documentaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.3047" x="549.2246" y="594.856">- aclarar periodos afectados</text></g><!--link PasoEdicion to DecidirAccion--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="52" id="lnk8"><path d="M529.96,675.8638 C529.96,703.5738 529.96,742.6338 529.96,770.3338" fill="none" id="PasoEdicion-to-DecidirAccion" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="529.96,776.3338,533.96,767.3338,529.96,771.3338,525.96,767.3338,529.96,776.3338" style="stroke:#008000;stroke-width:1;"/><path d="M534.96,698.5938 L534.96,753.5938 L944.96,753.5938 L944.96,708.5938 L934.96,698.5938 L534.96,698.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M934.96,698.5938 L934.96,708.5938 L944.96,708.5938 L934.96,698.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.4253" x="540.96" y="715.6606">Al finalizar la edici&#243;n, el Alumno decide:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.9277" x="540.96" y="730.7935">&#8226; guardarSolicitudDispensa(), o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.3462" x="540.96" y="745.9263">&#8226; cerrarSolicitudDispensa() para salir descartando cambios.</text></g><!--link DecidirAccion to *end*SOLICITUD_DISPENSA_ABIERTA--><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" data-source-line="59" id="lnk10"><path d="M529.96,827.0238 C529.96,839.3838 529.96,847.7238 529.96,857.1938" fill="none" id="DecidirAccion-to-*end*SOLICITUD_DISPENSA_ABIERTA" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="529.96,863.1938,533.96,854.1938,529.96,858.1938,525.96,854.1938,529.96,863.1938" style="stroke:#008000;stroke-width:1;"/></g><ellipse cx="752" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to DISPENSAS_ABIERTO--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="7" id="lnk3"><path d="M752,63.6569 C752,77.5869 752,98.2569 752,117.9469" fill="none" id="*start*-to-DISPENSAS_ABIERTO" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="752,123.9469,756,114.9469,752,118.9469,748,114.9469,752,123.9469" style="stroke:#008000;stroke-width:1;"/></g><!--link DISPENSAS_ABIERTO to SOLICITUD_DISPENSA_ABIERTA--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="11" id="lnk4"><path d="M667.87,156.3869 C472.78,170.5169 6,204.2969 6,204.2969 C6,204.2969 6,331.2969 6,331.2969 C6,331.2969 244.9333,426.1531 453.9933,509.1431" fill="none" id="DISPENSAS_ABIERTO-to-SOLICITUD_DISPENSA_ABIERTA" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="459.57,511.3569,452.6808,504.3185,454.9228,509.5121,449.7292,511.754,459.57,511.3569" style="stroke:#008000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.3452" x="154.7532" y="217.3638">crearSolicitudDispensa()</text><path d="M11,226.4297 L11,326.4297 L457,326.4297 L457,236.4297 L447,226.4297 L11,226.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M447,226.4297 L447,236.4297 L457,236.4297 L447,226.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="17" y="243.4966">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.2153" x="76.6362" y="243.4966">est&#225; en DISPENSAS_ABIERTO (listado de sus solicitudes)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.4492" x="17" y="258.6294">y selecciona "Crear nueva solicitud de dispensa()".</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="17" y="273.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="17" y="288.895">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.0933" x="80.0386" y="288.895">pide datos m&#237;nimos (asignatura, periodo/horario)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.0044" x="17" y="304.0278">y crea la solicitud, pasando a SOLICITUD_DISPENSA_ABIERTA</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.9795" x="17" y="319.1606">para completar la informaci&#243;n.</text></g><!--link DISPENSAS_ABIERTO to SOLICITUD_DISPENSA_ABIERTA--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="21" id="lnk5"><path d="M668.06,168.4269 C595.43,184.1169 502,204.2969 502,204.2969 C502,204.2969 502,331.2969 502,331.2969 C502,331.2969 507.7585,338.1231 523.2485,356.4631" fill="none" id="DISPENSAS_ABIERTO-to-SOLICITUD_DISPENSA_ABIERTA-1" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="527.12,361.0469,524.3686,351.5901,523.8937,357.227,518.2569,356.7521,527.12,361.0469" style="stroke:#008000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.9165" x="636.5408" y="217.3638">consultarSolicitudDispensa()</text><path d="M507,226.4297 L507,326.4297 L951,326.4297 L951,236.4297 L941,226.4297 L507,226.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M941,226.4297 L941,236.4297 L951,236.4297 L941,226.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.5039" x="513" y="243.4966">Alumno</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.5776" x="572.6362" y="243.4966">est&#225; en DISPENSAS_ABIERTO y selecciona</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.3901" x="513" y="258.6294">una solicitud existente para consultarla.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="513" y="273.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="513" y="288.895">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.9097" x="576.0386" y="288.895">muestra su estado (aprobada/rechazada/pendiente),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="423.998" x="513" y="304.0278">comentarios y datos actuales en SOLICITUD_DISPENSA_ABIERTA,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.5518" x="513" y="319.1606">desde donde se podr&#225; editar (por ejemplo, para apelar).</text></g><!--link SOLICITUD_DISPENSA_ABIERTA to DISPENSAS_ABIERTO--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="dependency" data-source-line="64" id="lnk11"><path d="M939.1,361.0469 C951.99,342.7069 960,331.2969 960,331.2969 C960,331.2969 960,204.2969 960,204.2969 C960,204.2969 899.5374,188.6048 841.8074,173.6148" fill="none" id="SOLICITUD_DISPENSA_ABIERTA-to-DISPENSAS_ABIERTO" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="836,172.1069,843.7058,178.2404,840.8395,173.3635,845.7164,170.4972,836,172.1069" style="stroke:#008000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.9092" x="1128.8054" y="239.8638">guardarSolicitudDispensa()</text><path d="M965,248.9297 L965,303.9297 L1469,303.9297 L1469,258.9297 L1459,248.9297 L965,248.9297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1459,248.9297 L1459,258.9297 L1469,258.9297 L1459,248.9297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="971" y="265.9966">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.9351" x="1034.0386" y="265.9966">guarda los cambios realizados en la solicitud</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="483.52" x="971" y="281.1294">(y, si aplica, podr&#225; pasar a estado PendienteRevision para nueva revisi&#243;n)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.2593" x="971" y="296.2622">y vuelve a DISPENSAS_ABIERTO.</text></g><!--link SOLICITUD_DISPENSA_ABIERTA to DISPENSAS_ABIERTO--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="dependency" data-source-line="71" id="lnk12"><path d="M1044.45,508.8069 C1247.6,426.3869 1482,331.2969 1482,331.2969 C1482,331.2969 1482,204.2969 1482,204.2969 C1482,204.2969 1034.0336,171.1595 842.0836,156.9595" fill="none" id="SOLICITUD_DISPENSA_ABIERTA-to-DISPENSAS_ABIERTO-1" style="stroke:#FF0000;stroke-width:1;"/><polygon fill="#FF0000" points="836.1,156.5169,844.7804,161.17,841.0864,156.8858,845.3706,153.1918,836.1,156.5169" style="stroke:#FF0000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.6899" x="1649.6343" y="247.3638">cerrarSolicitudDispensa()</text><path d="M1487,256.4297 L1487,296.4297 L1976,296.4297 L1976,266.4297 L1966,256.4297 L1487,256.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1966,256.4297 L1966,266.4297 L1976,266.4297 L1966,256.4297" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="1493" y="273.4966">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.8442" x="1556.0386" y="273.4966">descarta los cambios de edici&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="468.9585" x="1493" y="288.6294">y vuelve a DISPENSAS_ABIERTO, manteniendo la solicitud como estaba.</text></g><!--SRC=[hLLBRjj84DttAGhA8b8WstiZCC1On820OXcMCXiZ24fasUc4x2QwII7EO81S9TdFOZ17y4roabIHLDIq96OnqOeYg-lptglNbQvoWZZJ5JhmDjUfhkeCCe9C-vACH-K_QbEYmm9oRQXwA0bAcp_87wLyXHN1B5bUnrVBQFakUfN4Dwi5x7xeORJtVTGTN2xcoMMoUZDxjmtf8gBsuF7l8wLkNxo5azjdzux8l3svsEz2gUSmdyT_HBC8ee5QIkqF42OUwF8SKaVebblaPXrguuaobWUqHb3xg5wkBwAyBenzURQ-0FBLurSWSm2uSQuPcimA1RxsEqx8JzG3UCefJRKr2ADBgGocfWqUfcuy6PqgARtad5HWKxlK4e6LzL0y_cDqmGzZzFhUO5Kxd499JjlCdhst3lb9gigCa0TLE0ez6cuJXt0LsK1gYp8dqHTdqEREkW9J_VYVELLaCX2O_Xy1rlWwhtud2I7EgZOXlFH9i3ISjHkkAvxZFjH5pJKuoDTIJ4WTO-di6ZCySvI-ny_onArcMZ9EfegnuYU1tNCJBKkOLZNcvANLuq1C5Ij4cBL6b2CxcZcPhrtjSMaTq0TYAkoqRHrBoj5DGXQUm-NYzVM2qxrEuYi68hbQnJTN2uZc4C-ILNG3ys2HrA-t-2-bn0JQk6lqbgr6O0tUpYZLcNPH0tSR_dIpdnxiiIelZW1FEOZSwbmGbSq8DTmSJ2KBWzo7-bHjimPwAMlAwBpvyFtBjq3MxTaxP1amYxnDNiE66IMfUCmU9bEmFtCLDjDtEaLtXe__8eFHsvCd2GVapWfgJJTWEoGRHCjRTu2V4ZplJfq0yWdDSOMjzCRkNcSVQf5bPpQPJUj6fqrxkwYKIt1GPo0Cvnsb8dlVXEna9ly2IlictbF3GR8ZPbKRpFNdrbD8qd0ZK-6x9Oo1uZG1M_SrkkmWPY4FAJbtCAW5qNDDffiyCrKrxfTYiUPTFJqmO6-GteYiRlMtBDiocYTyDStYtbR9_p_Vn7FU7bwxUR9SHJE-oWQMRF0IP8SyFloUFuPRr1vhrgERaoNJm2xaiXlrjcdyC0NMARA0Khb5MlkHQyBn9T7vt_NMwsveexq0qm3RoierxvX8kN8sDUKRufDx0uM6DGoAe-mO94UP7aHaItqF4zx9hG87-vv28VvWU7v68iHElCGs4ArnDzqF]--></g></svg>