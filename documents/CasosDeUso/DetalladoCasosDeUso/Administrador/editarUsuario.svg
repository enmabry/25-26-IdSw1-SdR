<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="883px" preserveAspectRatio="none" style="width:406px;height:883px;background:#FFFFFF;" version="1.1" viewBox="0 0 406 883" width="406px" zoomAndPan="magnify"><title>Editar Usuario</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="112.7383" x="136.6309" y="22.9951">Editar Usuario</text></g><g id="USUARIO_ABIERTO_INICIAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.2891" x="123.86" y="44.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="123.86" x2="276.1491" y1="70.5938" y2="70.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.2891" x="133.86" y="62.292">USUARIO_ABIERTO</text></g><g id="USUARIO_ABIERTO_FINAL"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.2891" x="123.86" y="827.5969"/><line style="stroke:#181818;stroke-width:0.5;" x1="123.86" x2="276.1491" y1="853.8938" y2="853.8938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.2891" x="133.86" y="845.592">USUARIO_ABIERTO</text></g><path d="M19.5,154.2969 L380.5,154.2969 A12.5,12.5 0 0 1 393,166.7969 L393,180.5938 L7,180.5938 L7,166.7969 A12.5,12.5 0 0 1 19.5,154.2969" fill="#F1F1F1"/><rect fill="none" height="613.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="386" x="7" y="154.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="393" y1="180.5938" y2="180.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.3418" x="147.3291" y="172.292">editarUsuario()</text><g id="editarUsuario.RecuperacionDatos"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="297.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="323.8906" y2="323.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="315.5889">&#160;</text></g><g id="editarUsuario.EdicionEnCurso"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="19" y="539.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="69" y1="565.8906" y2="565.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="557.5889">&#160;</text></g><ellipse cx="44" cy="201.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="746.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="44" cy="746.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*editarUsuario to RecuperacionDatos--><g class="link" data-entity-1=".start.editarUsuario" data-entity-2="RecuperacionDatos" data-link-type="dependency" data-source-line="14" data-uid="lnk4" id="link_.start.editarUsuario_RecuperacionDatos"><path d="M44,211.9338 C44,230.1237 44,264.8338 44,291.2038" fill="none" id="*start*editarUsuario-to-RecuperacionDatos" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,297.2038,48,288.2038,44,292.2038,40,288.2038,44,297.2038" style="stroke:#008000;stroke-width:1;"/><path d="M49,234.5938 L49,274.5938 L384,274.5938 L384,244.5938 L374,234.5938 L49,234.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M374,234.5938 L374,244.5938 L384,244.5938 L374,234.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="104.8633" x="55" y="251.6606">Administrador</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.6704" x="163.9956" y="251.6606">decide modificar la informaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.7432" x="55" y="266.7935">de un usuario ya abierto en USUARIO_ABIERTO.</text></g><!--link RecuperacionDatos to EdicionEnCurso--><g class="link" data-entity-1="RecuperacionDatos" data-entity-2="EdicionEnCurso" data-link-type="dependency" data-source-line="20" data-uid="lnk5" id="link_RecuperacionDatos_EdicionEnCurso"><path d="M44,347.9238 C44,393.9238 44,487.1438 44,533.1938" fill="none" id="RecuperacionDatos-to-EdicionEnCurso" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,539.1938,48,530.1938,44,534.1938,40,530.1938,44,539.1938" style="stroke:#008000;stroke-width:1;"/><path d="M49,370.5938 L49,516.5938 L379,516.5938 L379,380.5938 L369,370.5938 L49,370.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M369,370.5938 L369,380.5938 L379,380.5938 L369,370.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="387.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.2085" x="118.0386" y="387.6606">mantiene el formulario del usuario</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.5903" x="55" y="402.7935">con los datos actuales y habilita los campos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.7524" x="55" y="417.9263">para su edici&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="55" y="433.0591">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="104.8633" x="55" y="448.1919">Administrador</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="45.1191" x="163.9956" y="448.1919">puede:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.8418" x="55" y="463.3247">&#8226; actualizar datos b&#225;sicos (nombre, email, etc.)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.1919" x="55" y="478.4575">&#8226; asignar o cambiar roles del usuario</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.0122" x="55" y="493.5903">&#8226; marcar al usuario como activo / desactivado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.6733" x="55" y="508.7231">(desactivarUsuario()).</text></g><!--link EdicionEnCurso to *end*editarUsuario--><g class="link" data-entity-1="EdicionEnCurso" data-entity-2=".end.editarUsuario" data-link-type="dependency" data-source-line="33" data-uid="lnk7" id="link_EdicionEnCurso_.end.editarUsuario"><path d="M44,589.8738 C44,629.7938 44,701.6438 44,729.4338" fill="none" id="EdicionEnCurso-to-*end*editarUsuario" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,735.4338,48,726.4338,44,730.4338,40,726.4338,44,735.4338" style="stroke:#008000;stroke-width:1;"/><path d="M49,612.5938 L49,712.5938 L378,712.5938 L378,622.5938 L368,612.5938 L49,612.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M368,612.5938 L368,622.5938 L378,622.5938 L368,612.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="629.6606">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.354" x="118.0386" y="629.6606">valida la informaci&#243;n editada y</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.3418" x="55" y="644.7935">mantiene el contexto en USUARIO_ABIERTO.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="55" y="659.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.3843" x="55" y="675.0591">A partir de aqu&#237; el Administrador podr&#225;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.2837" x="55" y="690.1919">&#8226; guardarUsuario() para persistir los cambios</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.3374" x="55" y="705.3247">&#8226; cerrarUsuario() para salir sin seguir editando.</text></g><!--link USUARIO_ABIERTO_INICIAL to editarUsuario--><g class="link" data-entity-1="USUARIO_ABIERTO_INICIAL" data-entity-2="editarUsuario" data-link-type="dependency" data-source-line="7" data-uid="lnk2" id="link_USUARIO_ABIERTO_INICIAL_editarUsuario"><path d="M200,94.6769 C200,109.4169 200,123.9769 200,147.9069" fill="none" id="USUARIO_ABIERTO_INICIAL-to-editarUsuario" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="200,153.9069,204,144.9069,200,148.9069,196,144.9069,200,153.9069" style="stroke:#008000;stroke-width:1;"/></g><!--link editarUsuario to USUARIO_ABIERTO_FINAL--><g class="link" data-entity-1="editarUsuario" data-entity-2="USUARIO_ABIERTO_FINAL" data-link-type="dependency" data-source-line="44" data-uid="lnk8" id="link_editarUsuario_USUARIO_ABIERTO_FINAL"><path d="M200,768.0069 C200,792.0269 200,806.6469 200,821.4069" fill="none" id="editarUsuario-to-USUARIO_ABIERTO_FINAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="200,827.4069,204,818.4