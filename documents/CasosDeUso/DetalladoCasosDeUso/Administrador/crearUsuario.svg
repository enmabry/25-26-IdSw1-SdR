ht="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="132.8408" x="19" y="568.2188"/><line style="stroke:#181818;stroke-width:0.5;" x1="19" x2="151.8408" y1="595.8281" y2="595.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.8408" x="29" y="587.752">IntroduccionDatos</text></g><g id="USUARIO_ABIERTO_COMP.DecisionFinal"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="104.0342" x="33.5" y="739.2188"/><line style="stroke:#181818;stroke-width:0.5;" x1="33.5" x2="137.5342" y1="766.8281" y2="766.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0342" x="43.5" y="758.752">DecisionFinal</text></g><ellipse cx="85.5" cy="404.2188" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="85.5" cy="837.2188" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="85.5" cy="837.2188" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start*USUARIO_ABIERTO_COMP to IntroduccionDatos--><g class="link" data-entity-1="*start*USUARIO_ABIERTO_COMP" data-entity-2="IntroduccionDatos" data-source-line="24" data-uid="lnk6" id="link_*start*USUARIO_ABIERTO_COMP_IntroduccionDatos"><path d="M85.5,414.2388 C85.5,441.8888 85.5,520.1288 85.5,562.0288" fill="none" id="*start*USUARIO_ABIERTO_COMP-to-IntroduccionDatos" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="85.5,568.0288,89.5,559.0288,85.5,563.0288,81.5,559.0288,85.5,568.0288" style="stroke:#008000;stroke-width:1;"/><path d="M90.5,437.2188 L90.5,545.2188 L420.5,545.2188 L420.5,447.2188 L410.5,437.2188 L90.5,437.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M410.5,437.2188 L410.5,447.2188 L420.5,447.2188 L410.5,437.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.8608" x="96.5" y="455.7139">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.7852" x="149.9727" y="455.7139">permite introducir la informaci&#243;n del usuario.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="96.5" y="472.0654">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="88.8418" x="96.5" y="488.417">Administrador</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7725" x="188.9536" y="488.417">introduce los datos requeridos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.2646" x="96.5" y="504.7686">&#8226; Credenciales (Usuario, Contrase&#241;a)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.1802" x="96.5" y="521.1201">&#8226; Datos personales (Nombre, DNI)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.0093" x="96.5" y="537.4717">&#8226; Roles (Profesor, Alumno, etc.)</text></g><!--link IntroduccionDatos to DecisionFinal--><g class="link" data-entity-1="IntroduccionDatos" data-entity-2="DecisionFinal" data-source-line="34" data-uid="lnk7" id="link_IntroduccionDatos_DecisionFinal"><path d="M85.5,618.4288 C85.5,650.5588 85.5,700.9488 85.5,733.0487" fill="none" id="IntroduccionDatos-to-DecisionFinal" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="85.5,739.0487,89.5,730.0487,85.5,734.0487,81.5,730.0487,85.5,739.0487" style="stroke:#008000;stroke-width:1;"/><path d="M90.5,641.2188 L90.5,716.2188 L422.5,716.2188 L422.5,651.2188 L412.5,641.2188 L90.5,641.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M412.5,641.2188 L412.5,651.2188 L422.5,651.2188 L412.5,641.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.8608" x="96.5" y="659.7139">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.9624" x="149.9727" y="659.7139">muestra los datos introducidos para revisi&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="96.5" y="676.0654">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="88.8418" x="96.5" y="692.417">Administrador</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.5825" x="188.9536" y="692.417">solicita finalizar la operaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6689" x="96.5" y="708.7686">(guardar o cancelar).</text></g><!--link DecisionFinal to *end*USUARIO_ABIERTO_COMP--><g class="link" data-entity-1="DecisionFinal" data-entity-2="*end*USUARIO_ABIERTO_COMP" data-source-line="42" data-uid="lnk9" id="link_DecisionFinal_*end*USUARIO_ABIERTO_COMP"><path d="M85.5,789.2588 C85.5,801.8088 85.5,810.4988 85.5,820.0688" fill="none" id="DecisionFinal-to-*end*USUARIO_ABIERTO_COMP" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="85.5,826.0688,89.5,817.0688,85.5,821.0688,81.5,817.0688,85.5,826.0688" style="stroke:#008000;stroke-width:1;"/></g><ellipse cx="219" cy="54.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to USUARIOS_ABIERTO_INICIAL--><g class="link" data-entity-1="*start*" data-entity-2="USUARIOS_ABIERTO_INICIAL" data-source-line="8" data-uid="lnk3" id="link_*start*_USUARIOS_ABIERTO_INICIAL"><path d="M219,64.6194 C219,78.4994 219,99.5794 219,119.4494" fill="none" id="*start*-to-USUARIOS_ABIERTO_INICIAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="219,125.4494,223,116.4494,219,120.4494,215,116.4494,219,125.4494" style="stroke:#008000;stroke-width:1;"/></g><!--link USUARIOS_ABIERTO_INICIAL to USUARIO_ABIERTO_COMP--><g class="link" data-entity-1="USUARIOS_ABIERTO_INICIAL" data-entity-2="USUARIO_ABIERTO_COMP" data-source-line="10" data-uid="lnk4" id="link_USUARIOS_ABIERTO_INICIAL_USUARIO_ABIERTO_COMP"><path d="M219,175.7194 C219,211.3294 219,275.7394 219,349.4694" fill="none" id="USUARIOS_ABIERTO_INICIAL-to-USUARIO_ABIERTO_COMP" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="219,355.4694,223,346.4694,219,350.4694,215,346.4694,219,355.4694" style="stroke:#008000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.0718" x="353.7122" y="220.1045">crearUsuario()</text><path d="M224,228.9609 L224,319.9609 L566,319.9609 L566,238.9609 L556,228.9609 L224,228.9609" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M556,228.9609 L556,238.9609 L566,238.9609 L556,228.9609" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="88.8418" x="230" y="247.4561">Administrador</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.0425" x="322.4536" y="247.4561">se encuentra en USUARIOS_ABIERTO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.0425" x="230" y="263.8076">y solicita crear un nuevo usuario.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="230" y="280.1592">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.8608" x="230" y="296.5107">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.1543" x="283.4727" y="296.5107">muestra un formulario de registro vac&#237;o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.0952" x="230" y="312.8623">y cambia el contexto a USUARIO_ABIERTO.</text></g><!--link USUARIO_ABIERTO_COMP to USUARIOS_ABIERTO_FINAL--><g class="link" data-entity-1="USUARIO_ABIERTO_COMP" data-entity-2="USUARIOS_ABIERTO_FINAL" data-source-line="45" data-uid="lnk10" id="link_USUARIO_ABIERTO_COMP_USUARIOS_ABIERTO_FINAL"><path d="M31.27,858.8594 C17.58,877.1494 9,888.6094 9,888.6094 C9,888.6094 9,959.6094 9,959.6094 C9,959.6094 72.8989,976.0458 131.9989,991.2358" fill="none" id="USUARIO_ABIERTO_COMP-to-USUARIOS_ABIERTO_FINAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="137.81,992.7294,130.089,986.6149,132.9674,991.4847,128.0976,994.3631,137.81,992.7294" style="stroke:#008000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.2617" x="147.6921" y="903.1045">guardarUsuario()</text><path d="M14,911.9609 L14,953.9609 L379,953.9609 L379,921.9609 L369,911.9609 L14,911.9609" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M369,911.9609 L369,921.9609 L379,921.9609 L369,911.9609" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.8608" x="20" y="930.4561">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.186" x="73.4727" y="930.4561">muestra los datos, registra el nuevo usuario</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.646" x="20" y="946.8076">y muestra nuevamente el listado en USUARIOS_ABIERTO.</text></g><!--link USUARIO_ABIERTO_COMP to USUARIOS_ABIERTO_FINAL--><g class="link" data-entity-1="USUARIO_ABIERTO_COMP" data-entity-2="USUARIOS_ABIERTO_FINAL" data-source-line="51" data-uid="lnk11" id="link_USUARIO_ABIERTO_COMP_USUARIOS_ABIERTO_FINAL"><path d="M370.07,858.8594 C381.09,877.1494 388,888.6094 388,888.6094 C388,888.6094 388,959.6094 388,959.6094 C388,959.6094 345.3156,973.2542 300.3156,987.6242" fill="none" id="USUARIO_ABIERTO_COMP-to-USUARIOS_ABIERTO_FINAL-1" style="stroke:#FF0000;stroke-width:1;"/><polygon fill="#FF0000" points="294.6,989.4494,304.3903,990.522,299.363,987.9284,301.9567,982.9011,294.6,989.4494" style="stroke:#FF0000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.4009" x="568.2471" y="903.1045">cerrarUsuario()</text><path d="M393,911.9609 L393,953.9609 L830,953.9609 L830,921.9609 L820,911.9609 L393,911.9609" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M820,911.9609 L820,921.9609 L830,921.9609 L820,911.9609" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.8608" x="399" y="930.4561">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.2134" x="452.4727" y="930.4561">descarta los datos introducidos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="416.895" x="399" y="946.8076">y muestra nuevamente el listado en USUARIOS_ABIERTO sin cambios.</text></g><!--SRC=[dPHBZXen48RtFaLfie688NiqGYAGaLfAO0HXDHgDZBj0rhXTn7QZa2XIpf9z5b6Em4tc92btysfUGc55s_NwlwfoqC4WT1rA1sEVIwT9-1TjvzB938os69PpX3cPPVmGmWSP4CQZSMUO34RFdVV9X-7dmNFIJxf9voE0z71pU7jppki-wL_fitNf3ZuzGF7RyzevYSUtJt3x-6Rc4EtJRVjifKASrN32lPg-1Ie2M_EgrOKbhfHivFKYxYRjJfffgtrmCYLtzsxI1e-0LkLe-Op_7PKbbk39QAM3B8D3Ri7ck238opHD4IEFE2fcieYPvHXJHCifkImtqGnI18Upc9nW8TNgDt5i9RE9viG65Dc0NmE1FDJM56XJY5B49VQd