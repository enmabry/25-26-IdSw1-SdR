 font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="271.66" y="460.8555">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.7827" x="271.66" y="476.166">Administrador</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.7295" x="372.556" y="476.166">introduce los datos requeridos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.937" x="271.66" y="491.4766">&#8226; Credenciales (Usuario, Contrase&#241;a)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.4873" x="271.66" y="506.7871">&#8226; Datos personales (Nombre, DNI)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.561" x="271.66" y="522.0977">&#8226; Roles (Profesor, Alumno, etc.)</text></g><!--link IntroduccionDatos to DecisionFinal--><g class="link" data-entity-1="IntroduccionDatos" data-entity-2="DecisionFinal" data-source-line="33" data-uid="lnk7" id="link_IntroduccionDatos_DecisionFinal"><path d="M260.66,602.3266 C260.66,633.5166 260.66,681.2866 260.66,712.5266" fill="none" id="IntroduccionDatos-to-DecisionFinal" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="260.66,718.5266,264.66,709.5266,260.66,713.5266,256.66,709.5266,260.66,718.5266" style="stroke:#008000;stroke-width:1;"/><path d="M265.66,624.9766 L265.66,695.9766 L628.66,695.9766 L628.66,634.9766 L618.66,624.9766 L265.66,624.9766" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M618.66,624.9766 L618.66,634.9766 L628.66,634.9766 L618.66,624.9766" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="52.1396" x="271.66" y="642.5449">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.1206" x="327.9129" y="642.5449">muestra los datos introducidos para revisi&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="271.66" y="657.8555">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.7827" x="271.66" y="673.166">Administrador</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.4922" x="372.556" y="673.166">solicita finalizar la operaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.1968" x="271.66" y="688.4766">(guardar o cancelar).</text></g><!--link DecisionFinal to *end*USUARIO_ABIERTO_COMP--><g class="link" data-entity-1="DecisionFinal" data-entity-2=".end.USUARIO_ABIERTO_COMP" data-source-line="41" data-uid="lnk9" id="link_DecisionFinal_.end.USUARIO_ABIERTO_COMP"><path d="M260.66,769.4066 C260.66,781.7666 260.66,790.1066 260.66,799.5766" fill="none" id="DecisionFinal-to-*end*USUARIO_ABIERTO_COMP" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="260.66,805.5766,264.66,796.5766,260.66,800.5766,256.66,796.5766,260.66,805.5766" style="stroke:#008000;stroke-width:1;"/></g><ellipse cx="408" cy="53.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to USUARIOS_ABIERTO_INICIAL--><g class="link" data-entity-1=".start." data-entity-2="USUARIOS_ABIERTO_INICIAL" data-source-line="7" data-uid="lnk3" id="link_.start._USUARIOS_ABIERTO_INICIAL"><path d="M408,63.8483 C408,77.7783 408,98.4483 408,118.1383" fill="none" id="*start*-to-USUARIOS_ABIERTO_INICIAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="408,124.1383,412,115.1383,408,119.1383,404,115.1383,408,124.1383" style="stroke:#008000;stroke-width:1;"/></g><!--link USUAR