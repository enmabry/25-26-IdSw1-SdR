4">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="151.6772" x="96.5" y="471.417">Administrador introduce</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6816" x="251.7891" y="471.417">los datos requeridos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.2646" x="96.5" y="487.7686">&#8226; Credenciales (Usuario, Contrase&#241;a)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.1802" x="96.5" y="504.1201">&#8226; Datos personales (Nombre, DNI)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.0093" x="96.5" y="520.4717">&#8226; Roles (Profesor, Alumno, etc.)</text></g><!--link IntroduccionDatos to *end*USUARIO_ABIERTO_COMP--><g class="link" data-entity-1="IntroduccionDatos" data-entity-2="*end*USUARIO_ABIERTO_COMP" data-source-line="32" data-uid="lnk8" id="link_IntroduccionDatos_*end*USUARIO_ABIERTO_COMP"><path d="M85.5,601.4388 C85.5,636.0088 85.5,691.9888 85.5,716.1688" fill="none" id="IntroduccionDatos-to-*end*USUARIO_ABIERTO_COMP" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="85.5,722.1688,89.5,713.1688,85.5,717.1688,81.5,713.1688,85.5,722.1688" style="stroke:#008000;stroke-width:1;"/><path d="M90.5,624.2188 L90.5,699.2188 L426.5,699.2188 L426.5,634.2188 L416.5,624.2188 L90.5,624.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M416.5,624.2188 L416.5,634.2188 L426.5,634.2188 L416.5,624.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="104.0508" x="96.5" y="642.7139">Sistema muestra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="204.1626" y="642.7139">los datos introducidos para revisi&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="96.5" y="659.0654">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="137.249" x="96.5" y="675.417">Administrador solicita</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.2344" x="237.3608" y="675.417">finalizar la operaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6689" x="96.5" y="691.7686">(guardar o cancelar).</text></g><ellipse cx="223.5" cy="54.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to USUARIOS_ABIERTO_INICIAL--><g class="link" data-entity-1="*start*" data-entity-2="USUARIOS_ABIERTO_INICIAL" data-source-line="8" data-uid="lnk3" id="link_*start*_USUARIOS_ABIERTO_INICIAL"><path d="M223.5,64.6194 C223.5,78.4994 223.5,99.5794 223.5,119.4494" fill="none" id="*start*-to-USUARIOS_ABIERTO_INICIAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="223.5,125.4494,227.5,116.4494,223.5,120.4494,219.5,116.4494,223.5,125.4494" style="stroke:#008000;stroke-width:1;"/></g><!--link USUARIOS_ABIERTO_INICIAL to USUARIO_ABIERTO_COMP--><g class="link" data-entity-1="USUARIOS_ABIERTO_INICIAL" data-entity-2="USUARIO_ABIERTO_COMP" data-source-line="10" data-uid="lnk4" id="link_USUARIOS_ABIERTO_INICIAL_USUARIO_ABIERTO_COMP"><path d="M223.5,175.6594 C223.5,209.0794 223.5,266.8394 223.5,332.1394" fill="none" id="USUARIOS_ABIERTO_INICIAL-to-USUARIO_ABIERTO_COMP" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="223.5,338.1394,227.5,329.1394,223.5,333.1394,219.5,329.1394,223.5,338.1394" style="stroke:#008000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacin