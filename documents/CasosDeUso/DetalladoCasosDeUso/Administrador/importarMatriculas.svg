spacing" textLength="244.3149" x="55" y="403.8555">&#8226; Que los datos indicados sean v&#225;lidos</text></g><!--link ValidacionEstructura to CargaMasiva--><g class="link" data-entity-1="ValidacionEstructura" data-entity-2="CargaMasiva" data-source-line="28" data-uid="lnk6" id="link_ValidacionEstructura_CargaMasiva"><path d="M44,484.2466 C44,508.5266 44,539.6666 44,563.8866" fill="none" id="ValidacionEstructura-to-CargaMasiva" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,569.8866,48,560.8866,44,564.8866,40,560.8866,44,569.8866" style="stroke:#008000;stroke-width:1;"/><path d="M49,506.9766 L49,546.9766 L301,546.9766 L301,516.9766 L291,506.9766 L49,506.9766" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M291,506.9766 L291,516.9766 L301,516.9766 L291,506.9766" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="52.1396" x="55" y="524.5449">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.8906" x="111.2529" y="524.5449">registra las relaciones entre</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.269" x="55" y="539.8555">Alumnos y Cursos (Matriculaci&#243;n)</text></g><!--link CargaMasiva to *end*importarMatriculas--><g class="link" data-entity-1="CargaMasiva" data-entity-2=".end.importarMatriculas" data-source-line="34" data-uid="lnk8" id="link_CargaMasiva_.end.importarMatriculas"><path d="M44,620.2566 C44,646.4266 44,680.8266 44,699.6566" fill="none" id="CargaMasiva-to-*end*importarMatriculas" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,705.6566,48,696.6566,44,700.6566,40,696.6566,44,705.6566" style="stroke:#008000;stroke-width:1;"/><path d="M49,642.9766 L49,682.9766 L321,682.9766 L321,652.9766 L311,642.9766 L49,642.9766" fill="#FEFFDD" style="stro